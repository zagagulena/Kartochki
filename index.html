            return `<div class="gm-end">
                ${scnHtml(g.sc || 'hello', r.stars >= 2 ? 'up' : r.stars === 1 ? 'wave' : 'down', 'big ' + an, extra)}
                <div class="gm-stars">${[1, 2, 3].map(k => `<span class="${k <= r.stars ? 'on' : ''}">${ic('star')}</span>`).join('')}</div>
                <h2>${esc(r.title)}</h2>
                <p>${esc(r.detail)}${g.record ? ' · новый рекорд!' : ''}</p>
                <button class="pri" onclick="startGame('${g.kind}')">${ic('undo')}Играть ещё раз</button>
                <button class="pri sec" onclick="stopGame();render()">К списку игр</button>
            </div>`;
        }

        /* --- 1. Выбери перевод --- */
        function setScene(g, sc) {
            if (g.sc === sc) return;
            g.sc = sc;
            const i = (SCN[sc] || SCN.hello).intro;
            g.say = { pose: 'wave', b: i[0], s: i[1] };
            g.swap = true;
        }
        function quizQ() {
            const g = G, c = g.deck[g.n], dir = Math.random() < .4 ? 1 : 0;
            setScene(g, sceneFor(c));   // 0: норв. → рус., 1: рус. → норв.
            const key = x => (dir ? x.no : x.ru).toLowerCase();
            const used = new Set([key(c)]), wrong = [];
            for (const src of [g.pool, cards()]) {
                for (const x of shuffled(src)) { if (wrong.length >= 3) break; const k = key(x); if (!used.has(k)) { used.add(k); wrong.push(x); } }
            }
            g.q = { c, dir, pick: -1, opts: shuffled([c].concat(wrong)).map(x => ({ c: x, ok: x === c })) };
        }
        function quizHtml() {
            const g = G, q = g.q, c = q.c, done = q.pick >= 0;
            const opts = q.opts.map((o, k) => {
                const cl = !done ? '' : o.ok ? 'ok' : k === q.pick ? 'bad' : 'dim';
                return `<button class="gm-opt ${cl}" ${done ? 'disabled' : ''} onclick="quizPick(${k})">${esc(q.dir ? o.c.no : o.c.ru)}</button>`;
            }).join('');
            const body = `
                <div class="gm-q"><div class="gm-l">Вопрос ${g.n + 1} из ${g.total} · ${q.dir ? 'Как по-норвежски?' : 'Что это значит?'}</div>
                    <div class="gm-w${gmCls(q.dir ? c.ru : c.no)}">${esc(q.dir ? c.ru : c.no)}</div></div>
                <div class="gm-opts">${opts}</div>
                ${done && !q.opts[q.pick].ok ? `<button class="pri" onclick="quizNext()">Дальше</button>` : ''}`;
            return gShell(body, (g.n + (done ? 1 : 0)) / g.total * 100, g.score);
        }
        function quizPick(k) {
            const g = G; if (!g || g.done || g.kind !== 'quiz') return;
            const q = g.q; if (q.pick >= 0) return;
            q.pick = k;
            const o = q.opts[k], c = q.c;
            if (o.ok) { g.score++; gSay(true, c.no + ' — ' + c.ru); g.adv = setTimeout(() => { if (G === g && !g.done && g.q === q) quizNext(); }, 1000); }
            else { gWrong(c); gSay(false, 'Правильно: ' + c.no + ' — ' + c.ru); }
            renderGame();
        }
        function quizNext() {
            const g = G; if (!g || g.done) return;
            clearTimeout(g.adv);
            g.n++;
            if (g.n >= g.total) { gFinish(); return; }
            quizQ(); renderGame();
        }

        /* --- 2. Найди пару --- */
        function pairsHtml() {
            const g = G;
            const col = (arr, side) => arr.map(c => {
                const cl = g.got.has(c.id) ? 'ok' : g.bad && g.bad.some(b => b.id === c.id && b.side === side) ? 'bad' : g.sel && g.sel.id === c.id && g.sel.side === side ? 'sel' : '';
                return `<button class="gm-p ${cl}" onclick="pairTap('${side}','${c.id}')">${esc(side === 'no' ? c.no : c.ru)}</button>`;
            }).join('');
            const body = `<div class="gm-hint">Выбери слово слева и его перевод справа</div><div class="gm-pairs"><div class="gm-col">${col(g.L, 'no')}</div><div class="gm-col">${col(g.R, 'ru')}</div></div>`;
            return gShell(body, g.got.size / g.total * 100, g.got.size + '/' + g.total);
        }
        function pairTap(side, id) {
            const g = G; if (!g || g.done || g.lock || g.got.has(id)) return;
            if (!g.sel || g.sel.side === side) { g.sel = { side, id }; hap(true); renderGame(); return; }
            const a = g.sel, b = { side, id };
            if (a.id === id) {
                g.got.add(id); g.sel = null;
                const c = g.L.find(x => x.id === id);
                gSay(true, c.no + ' — ' + c.ru);
                if (g.got.size >= g.total) { g.lock = true; g.adv = setTimeout(() => { if (G === g) gFinish(); }, 700); }
                renderGame();
            } else {
                g.mis++; g.bad = [a, b]; g.lock = true;
                gSay(false, 'Это не пара — попробуй ещё');
                renderGame();
                g.adv = setTimeout(() => { if (G !== g || g.done) return; g.bad = null; g.sel = null; g.lock = false; renderGame(); }, 650);
            }
        }

        /* --- 3. Собери слово --- */
        function buildQ() {
            const g = G, c = g.deck[g.n], t = c.no.trim().toLowerCase();
            setScene(g, sceneFor(c));
            g.q = {
                c, t, res: null, failed: false, hint: 0,
                slots: [...t].map(ch => ch === ' ' ? { ch, sp: 1 } : { ch, fill: null, tile: -1, lock: false }),
                tiles: shuffled([...t].filter(x => x !== ' ')).map(ch => ({ ch, used: false }))
            };
        }
        function buildHtml() {
            const g = G, q = g.q, c = q.c;
            const slots = q.slots.map((s, i) => s.sp ? '<div class="gm-slot sp"></div>' :
                `<button class="gm-slot ${s.fill !== null ? 'f' : ''} ${q.res === 'ok' ? 'ok' : ''} ${q.res === 'skip' ? 'rv' : ''} ${q.res === 'bad' && !s.lock ? 'bad' : ''} ${s.lock && !q.res ? 'lk' : ''}" onclick="bSlot(${i})">${s.fill !== null ? esc(s.fill.toUpperCase()) : ''}</button>`).join('');
            const tiles = q.tiles.map((t, k) => `<button class="gm-lt ${t.used ? 'used' : ''}" onclick="bTile(${k})">${esc(t.ch.toUpperCase())}</button>`).join('');
            const tools = q.res === null
                ? `<div class="gm-tools"><button class="pri sec" onclick="bHint()">Подсказка</button><button class="pri ghost" onclick="bSkip()">Не знаю</button></div>`
                : q.res === 'skip' ? `<button class="pri" onclick="bNext()">Дальше</button>` : '';
            const body = `
                <div class="gm-q"><div class="gm-l">Слово ${g.n + 1} из ${g.total} · Собери по-норвежски</div>
                    <div class="gm-w${gmCls(c.ru)}">${esc(c.ru)}</div></div>
                <div class="gm-slots">${slots}</div>
                <div class="gm-tiles">${tiles}</div>
                ${tools}`;
            return gShell(body, (g.n + (q.res === 'ok' || q.res === 'skip' ? 1 : 0)) / g.total * 100, g.score);
        }
        function bTile(k) {
            const g = G; if (!g || g.done) return;
            const q = g.q; if (q.res !== null) return;
            const t = q.tiles[k]; if (t.used) return;
            const idx = q.slots.findIndex(s => !s.sp && s.fill === null); if (idx < 0) return;
            q.slots[idx].fill = t.ch; q.slots[idx].tile = k; t.used = true;
            hap(true);
            bCheck();
        }
        function bSlot(i) {
            const g = G; if (!g || g.done) return;
            const q = g.q, s = q.slots[i];
            if (q.res !== null || s.sp || s.fill === null || s.lock) return;
            q.tiles[s.tile].used = false; s.fill = null; s.tile = -1;
            renderGame();
        }
        function bCheck() {
            const g = G, q = g.q;
            if (q.slots.some(s => !s.sp && s.fill === null)) { renderGame(); return; }
            const word = q.slots.map(s => s.sp ? ' ' : s.fill).join('');
            if (word === q.t) {
                q.res = 'ok';
                if (!q.failed && !q.hint) g.score++;
                gSay(true, q.c.no + ' — ' + q.c.ru);
                g.adv = setTimeout(() => { if (G === g && !g.done && g.q === q) bNext(); }, 1100);
            } else {
                q.res = 'bad'; q.failed = true;
                gWrong(q.c);
                gSay(false, 'Попробуй ещё раз');
                g.adv = setTimeout(() => {
                    if (G !== g || g.done || g.q !== q) return;
                    q.slots.forEach(s => { if (!s.sp && !s.lock) { if (s.tile >= 0) q.tiles[s.tile].used = false; s.fill = null; s.tile = -1; } });
                    q.res = null; renderGame();
                }, 800);
            }
            renderGame();
        }
        function bHint() {
            const g = G; if (!g || g.done) return;
            const q = g.q; if (q.res !== null) return;
            q.slots.forEach(s => { if (!s.sp && !s.lock && s.fill !== null && s.fill !== s.ch) { q.tiles[s.tile].used = false; s.fill = null; s.tile = -1; } });
            const s = q.slots.find(x => !x.sp && x.fill === null); if (!s) return;
            const k = q.tiles.findIndex(t => !t.used && t.ch === s.ch); if (k < 0) return;
            s.fill = s.ch; s.tile = k; s.lock = true; q.tiles[k].used = true; q.hint++;
            bCheck();
        }
        function bSkip() {
            const g = G; if (!g || g.done) return;
            const q = g.q; if (q.res !== null) return;
            q.slots.forEach(s => { if (!s.sp) { s.fill = s.ch; s.lock = true; } });
            q.tiles.forEach(t => t.used = true);
            q.res = 'skip';
            gWrong(q.c);
            gSay(false, 'Это слово: ' + q.c.no);
            renderGame();
        }
        function bNext() {
            const g = G; if (!g || g.done) return;
            clearTimeout(g.adv);
            g.n++;
            if (g.n >= g.total) { gFinish(); return; }
            buildQ(); renderGame();
        }

        /* --- 4. Блиц: верно или нет --- */
        function blitzQ() {
            const g = G;
            let c, k = 0;
            do { c = g.elig[rnd(g.elig.length)]; k++; } while (c.id === g.last && g.elig.length > 1 && k < 10);
            g.last = c.id;
            setScene(g, sceneFor(c));
            let truth = Math.random() < .5, shown = c;
            if (!truth) {
                const others = g.elig.filter(x => x.ru.toLowerCase() !== c.ru.toLowerCase());
                shown = others.length ? others[rnd(others.length)] : c;
                if (shown === c) truth = true;
            }
            g.q = { c, ru: shown.ru, truth, res: null };
        }
        function blitzHtml() {
            const g = G, q = g.q, c = q.c;
            const rem = Math.max(0, g.limit - (Date.now() - g.t0));
            const lives = [0, 1, 2].map(k => `<svg viewBox="-16 -16 32 30" width="28" height="26" class="${k < g.lives ? '' : 'lost'}">${PR.heart(0, 0, 1)}</svg>`).join('');
            const dis = q.res !== null ? 'disabled' : '';
            const body = `
                <div class="gm-lives">${lives}<span class="gm-time" id="gm-time">${Math.ceil(rem / 1000)} c</span></div>
                <div class="gm-q ${q.res === true ? 'ok' : q.res === false ? 'bad' : ''}">
                    <div class="gm-w${gmCls(c.no)}">${esc(c.no)}</div>
                    <div class="gm-eq">=</div>
                    <div class="gm-w alt${gmCls(q.ru)}">${esc(q.ru)}</div>
                </div>
                <div class="gm-tf">
                    <button class="gm-no" ${dis} onclick="blitzAns(false)">${ic('x')} Неверно</button>
                    <button class="gm-yes" ${dis} onclick="blitzAns(true)">${ic('check')} Верно</button>
                </div>`;
            return gShell(body, rem / g.limit * 100, g.score, rem < 10000);
        }
        function blitzAns(yes) {
            const g = G; if (!g || g.done || g.kind !== 'blitz') return;
            const q = g.q; if (q.res !== null) return;
            const ok = yes === q.truth;
            q.res = ok;
            if (ok) { g.score++; gSay(true, q.c.no + ' — ' + q.c.ru); }
            else { g.lives--; gWrong(q.c); gSay(false, 'Правильно: ' + q.c.no + ' — ' + q.c.ru); }
            renderGame();
            if (g.lives <= 0) { g.adv = setTimeout(() => { if (G === g) gFinish(); }, 900); return; }
            g.adv = setTimeout(() => { if (G !== g || g.done) return; blitzQ(); renderGame(); }, ok ? 550 : 1000);
        }
        function blitzTick() {
            const g = G;
            if (!g || g.kind !== 'blitz' || g.done) { clearInterval(gTimer); return; }
            const rem = Math.max(0, g.limit - (Date.now() - g.t0));
            const bi = $('gm-bi'), tm = $('gm-time');
            if (bi) { bi.style.width = (rem / g.limit * 100) + '%'; bi.parentNode.classList.toggle('warn', rem < 10000); }
            if (tm) tm.textContent = Math.ceil(rem / 1000) + ' c';
            if (rem <= 0) gFinish();
        }

        /* Свайп: карточка едет за пальцем, темнеет и подсвечивается; вправо — «знаю», влево — «не знаю» */
        let tx = 0, ty = 0, tcard = null, drag = false, swiped = false, busy = false;
        const TH = () => Math.min(120, window.innerWidth * 0.28);

        let pdx = 0, praf = 0;
        function paint(card, dx) {
            const sh = card._sh || (card._sh = card.querySelector('.shade')), st = card._st || (card._st = card.querySelector('.stamp'));
            card.style.transform = `translate3d(${dx}px,0,0) rotate(${dx / 18}deg) scale(1.02)`;
            const sg = dx > 0 ? 1 : -1;
            if (card._sg !== sg) {
                card._sg = sg;
                sh.style.setProperty('--sc', sg > 0 ? 'rgba(76,217,160,.8)' : 'rgba(255,176,77,.8)');
                st.textContent = sg > 0 ? 'Знаю' : 'Не знаю';
            }
            sh.style.opacity = Math.min(Math.abs(dx) / (TH() * 1.4), 1) * .9;
            st.style.opacity = Math.max(0, Math.min((Math.abs(dx) - 20) / TH(), 1));
        }
        function unpaint(card) {
            card.style.transform = '';
            card.querySelector('.shade').style.opacity = 0;
            card.querySelector('.stamp').style.opacity = 0;
        }
        function fling(card, v) {
            busy = true;
            const dir = v === 'k' ? 1 : -1;
            card.classList.remove('drag');
            card.style.transition = 'transform .28s ease-in, opacity .28s ease-in';
            card.style.transform = `translateX(${dir * (window.innerWidth + 200)}px) rotate(${dir * 24}deg)`;
            card.style.opacity = 0;
            setTimeout(() => { busy = false; mark(v); }, 260);
        }
        // Кнопки «Знаю / Не знаю» — та же анимация
        function fly(v) {
            const c = document.querySelector('.card');
            if (!c || busy) { mark(v); return; }
            paint(c, v === 'k' ? 50 : -50);
            fling(c, v);
        }

        $('v').addEventListener('touchstart', e => {
            if (busy) return;
            const c = e.target.closest('.card');
            tcard = tab === 'study' ? c : null;
            drag = false;
            if (tcard) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
        }, { passive: true });
        $('v').addEventListener('touchmove', e => {
            if (!tcard || busy) return;
            const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
            if (!drag && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { drag = true; tcard.classList.add('drag'); }
            if (drag) { pdx = dx; if (!praf) praf = requestAnimationFrame(() => { praf = 0; if (tcard && drag) paint(tcard, pdx); }); }
        }, { passive: true });
        const endTouch = e => {
            const c = tcard;
            tcard = null;
            if (!c || !drag) return;
            drag = false;
            swiped = true;
            setTimeout(() => swiped = false, 400);
            const dx = e.changedTouches[0].clientX - tx;
            if (e.type === 'touchend' && Math.abs(dx) >= TH()) fling(c, dx > 0 ? 'k' : 'u');
            else { c.classList.remove('drag'); unpaint(c); }
        };
        $('v').addEventListener('touchend', endTouch);
        $('v').addEventListener('touchcancel', endTouch);

        /* Прячем нижнее меню, пока открыта клавиатура */
        const isText = el => el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !/^(color|file)$/.test(el.type);
        document.addEventListener('focusin', e => { if (isText(e.target)) { document.body.classList.add('typing'); document.body.classList.remove('nav-peek'); } });
        document.addEventListener('focusout', () => setTimeout(() => { if (!isText(document.activeElement)) document.body.classList.remove('typing', 'nav-peek'); }, 120));

        /* Свайп вниз — нижнее меню пропадает, свайп вверх — появляется (в т.ч. при открытой клавиатуре) */
        let sy = 0, sx = 0;
        document.addEventListener('touchstart', e => { sy = e.touches[0].clientY; sx = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchmove', e => {
            const dy = e.touches[0].clientY - sy, dx = e.touches[0].clientX - sx;
            if (Math.abs(dy) < 24 || Math.abs(dy) < Math.abs(dx)) return;   // горизонтальный свайп карточки не трогаем
            const up = dy < 0, b = document.body.classList;
            if (up ? (b.contains('nav-peek') && !b.contains('nav-hide')) : (b.contains('nav-hide') && !b.contains('nav-peek'))) return;   // уже в нужном состоянии
            b.toggle('nav-hide', !up);
            b.toggle('nav-peek', up);
        }, { passive: true });

        document.addEventListener('keydown', e => {
            if (tab !== 'study' || /INPUT|SELECT/.test(e.target.tagName)) return;
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!flipping) doFlip(); }
            else if (e.key === 'ArrowLeft') mark('u');
            else if (e.key === 'ArrowRight') mark('k');
            else if (e.key === 'z' || e.key === 'Z' || e.key === 'я') undoAns();
        });

        [['study', 'cards'], ['list', 'list'], ['add', 'plus'], ['games', 'gamepad'], ['settings', 'gear']].forEach(([t, n]) => { $('t-' + t).innerHTML = ic(n); });

        /* Проведение пальцем по нижней панели переключает вкладки */
        (function () {
            const nav = document.querySelector('nav');
            let down = false, moved = false, x0 = 0;
            const pick = x => {
                const bs = [...nav.querySelectorAll('button')];
                const r0 = bs[0].getBoundingClientRect(), r1 = bs[bs.length - 1].getBoundingClientRect();
                if (x < r0.left) return bs[0];
                if (x >= r1.right) return bs[bs.length - 1];
                return bs.find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x < r.right; });
            };
            nav.addEventListener('pointerdown', e => { down = true; moved = false; x0 = e.clientX; });
            nav.addEventListener('pointermove', e => {
                if (!down) return;
                if (!moved && Math.abs(e.clientX - x0) > 8) { moved = true; try { nav.setPointerCapture(e.pointerId); } catch (_) {} }
                if (!moved) return;
                const b = pick(e.clientX);
                if (b && b.id !== 't-' + tab) { go(b.id.slice(2)); try { tg?.HapticFeedback?.selectionChanged(); } catch (_) {} }
            });
            const up = () => { down = false; };
            nav.addEventListener('pointerup', up); nav.addEventListener('pointercancel', up);
        })();
        build();
        render();
        perfProbe();
        cloudInit();
    </script>
</body>
</html>
