        :root {
            /* Настройки (меняются из JS) */
            --c-r: 255; --c-g: 255; --c-b: 255;
            --a1: .26; --a2: .07; --a3: .14;   /* прозрачность «стекла» */
            --bg-img: none;
            --bg-color: #1e7fd8;
            --tint: 0;                          /* насколько цвет фона проступает поверх фото */

            --tx: #fff;
            --mut: rgba(255, 255, 255, .92);
            --ctx: #fff;                        /* цвет текста на карточках */
            --scrim: rgba(8, 28, 70, .40);      /* тёмная подложка под «стеклом» — текст читается на любом фоне */
            --tsh: 0 1px 2px rgba(0, 20, 60, .6);
            --ctsh: var(--tsh);
            --cmut: rgba(255, 255, 255, .9);
            --ac: #ff6b81;
            --ok: #4cd9a0;
            --no: #ffb04d;

            --bd: rgba(var(--c-r), var(--c-g), var(--c-b), .35);
            --glass: linear-gradient(var(--scrim), var(--scrim)), linear-gradient(135deg, rgba(var(--c-r), var(--c-g), var(--c-b), var(--a1)), rgba(var(--c-r), var(--c-g), var(--c-b), var(--a2)) 55%, rgba(var(--c-r), var(--c-g), var(--c-b), var(--a3)));
            --blur: blur(14px);
            --edge: inset 0 1px 1px rgba(255, 255, 255, .5), 0 4px 14px rgba(0, 30, 90, .22);
        }

        /* Заставка запуска */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #000;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity .7s ease;
            touch-action: none;
        }
        #splash.out { opacity: 0; pointer-events: none; }
        /* мягкое светлое свечение под логотипом: белый фон логотипа сливается с ним (multiply), картинка остаётся видна вокруг */
        #splash::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(104vw, 480px); height: min(86vw, 400px); transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(255, 255, 255, .97) 0%, rgba(255, 255, 255, .94) 58%, rgba(255, 255, 255, 0) 100%); filter: blur(4px); opacity: 0; animation: spGlow .8s ease-out forwards; pointer-events: none; }
        @keyframes spGlow { to { opacity: 1; } }
        #splash img { mix-blend-mode: multiply; width: min(74vw, 340px); height: auto; display: block; opacity: 0; transform: scale(.96); animation: spIn .7s ease-out .1s forwards; pointer-events: none; -webkit-user-drag: none; }
        @keyframes spIn { to { opacity: 1; transform: none; } }
        body.splashing { overflow: hidden; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; padding: 0; }

        /* Карточка при вылете уходит за экран — не даём странице ехать вбок вместе с фоном */
        html, body {
            overflow-x: hidden;
            overflow-x: clip;
            max-width: 100%;
            overscroll-behavior-x: none;
        }
        body { touch-action: pan-y pinch-zoom; }

        body {
            color: var(--tx);
            font: 500 17px/1.45 "Russo One", system-ui, -apple-system, "SF Pro Display", Segoe UI, Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            text-shadow: var(--tsh);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-text-size-adjust: 100%;
        }

        /* Фон отдельным фиксированным слоем: background-attachment:fixed глючит на iOS */
        body::before {
            content: "";
            transform: translateZ(0);
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--bg-img) center / cover no-repeat;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg-color);
            opacity: var(--tint);
            pointer-events: none;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 { font-size: 24px; margin: 4px 2px 0; font-weight: 700; }

        /* Логотип: стеклянные капли */
        h1.logo { margin: 0 0 4px; padding: 0; text-align: center; line-height: 0; font-size: 0; }
        h1.logo img {
            width: min(66vw, 240px);
            height: auto;
            display: inline-block;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
            animation: floaty 5s ease-in-out infinite alternate;
        }
        @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-4px); } }
        @media (prefers-reduced-motion: reduce) { h1.logo img { animation: none; } }

        /* Нижняя навигация — под большой палец */
        nav {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            width: calc(100% - 24px);
            max-width: 536px;
            z-index: 10;
            display: flex;
            gap: 4px;
            padding: 6px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transition: transform .2s ease, opacity .2s ease;
        }
        /* Прячем меню, когда открыта клавиатура */
        body.typing nav { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
        /* Свайп вниз прячет меню */
        body.nav-hide nav { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
        /* Свайп вверх возвращает меню, даже если открыта клавиатура */
        body.typing.nav-peek nav { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }

        button, select, input { font: inherit; color: var(--ctx); text-shadow: inherit; margin: 0; }
        .card, .item, .panel, nav, select, input, textarea, .ib, .sm { text-shadow: var(--ctsh); }

        nav button {
            flex: 1;
            min-height: 48px;
            padding: 0 6px;
            font-size: 16px;
            font-weight: 700;
            border: 0;
            background: transparent;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s ease;
            white-space: nowrap;
        }
        nav button#t-settings { flex: 0 0 56px; font-size: 18px; }
        nav button { position: relative; z-index: 1; }
        nav button.on { background: transparent; box-shadow: none; }

        .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }

        select, input, textarea, .ib, .sm, .pick {
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
        }

        select, input[type="text"], input:not([type]), textarea {
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 16px;      /* 16px — чтобы iOS не зумил страницу при фокусе */
            width: 100%;
            min-width: 0;
            outline: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        select option { color: #123; }
        input::placeholder { color: var(--cmut); }
        input:focus, select:focus { border-color: rgba(255, 255, 255, .8); }

        .row select, .row .pick { flex: 1 1 100%; }
        @media (min-width: 400px) { .row select, .row .pick { flex: 1; } }

        .ib {
            min-height: 52px;
            padding: 0 18px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats { display: flex; gap: 6px 12px; font-size: 15px; font-weight: 600; color: var(--mut); margin: 2px 2px 8px; flex-wrap: wrap; justify-content: center; text-align: center; }
        .stats b { color: var(--tx); font-weight: 800; }

        .card {
            position: relative;
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--bd);
            border-radius: 32px;
            min-height: 300px;
            min-height: min(52dvh, 420px);
            padding: 40px 20px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            color: var(--ctx);
                                    box-shadow: var(--edge);
            transition: transform .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }
        .card { transform-origin: 50% 100%; will-change: transform; }
        .card:active { transform: scale(.97); }
        .card.drag { transition: none; }
        .card.enter { animation: cardIn .28s ease-out; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: none; } }
        /* Затемнение с цветом стороны, проступает по мере смещения карточки */
        .card > .shade {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(rgba(0, 20, 50, .3), rgba(0, 20, 50, .3)), var(--sc, transparent);
        }
        .card > .stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            translate: -50% -50%;
            opacity: 0;
            pointer-events: none;
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            padding: 8px 18px;
            border: 3px solid #fff;
            border-radius: 16px;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 30, 90, .45);
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 60% at 15% 0, rgba(255, 255, 255, .35), transparent 55%);
            pointer-events: none;
        }
        .card > * { position: relative; }
        .card .cat { position: absolute; top: 18px; left: 22px; font-size: 14px; color: var(--cmut); font-weight: 700; letter-spacing: .02em; }
        .card .big { font-size: 36px; font-weight: 800; overflow-wrap: anywhere; line-height: 1.2; }
        .card .ans { font-size: 28px; font-weight: 650; margin-top: 14px; color: var(--ctx); opacity: 1; line-height: 1.25; overflow-wrap: anywhere; }
        .card .ex { margin-top: 18px; color: var(--cmut); font-style: normal; font-weight: 500; font-size: 19px; line-height: 1.4; }
        .card .hint { position: absolute; bottom: 16px; font-size: 15px; font-weight: 600; color: var(--cmut); opacity: .85; }

        .act { display: flex; gap: 12px; margin-top: 4px; }
        .act button {
            flex: 1;
            min-height: 60px;
            padding: 0 12px;
            border-radius: 24px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transition: transform .1s;
        }
        .act button:active { transform: scale(.95); }
        .bn { background: linear-gradient(135deg, rgba(255, 176, 77, .65), rgba(255, 176, 77, .25)); }
        .bk { background: linear-gradient(135deg, rgba(76, 217, 160, .65), rgba(76, 217, 160, .25)); }
        .swipe-tip { text-align: center; font-size: 14px; font-weight: 600; color: var(--mut); margin-top: 2px; }

        .empty { text-align: center; color: var(--mut); padding: 48px 20px; font-size: 18px; line-height: 1.5; }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 12px 12px 16px;
            margin-bottom: 10px;
            border-radius: 20px;
            color: var(--ctx);
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
        }
        .item .t { flex: 1; min-width: 0; font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
        .item .t small { display: block; color: var(--cmut); font-size: 15px; margin-top: 2px; font-weight: 500; }

        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, .35); flex: none; margin-right: 4px; }
        .dot.k { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
        .dot.u { background: var(--no); box-shadow: 0 0 10px var(--no); }

        .sm {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            padding: 0;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sm.armed { width: auto; padding: 0 12px; font-size: 14px; font-weight: 650; background: linear-gradient(135deg, rgba(255, 90, 90, .75), rgba(255, 90, 90, .35)); color: #fff; }
        .del-cur { margin-top: 6px; min-height: 44px; font-size: 15px; font-weight: 500; }
        .del-cur.armed { background: linear-gradient(135deg, rgba(255, 90, 90, .7), rgba(255, 90, 90, .3)); box-shadow: var(--edge); }

        label { display: block; font-size: 15px; color: var(--mut); margin: 14px 4px 6px; font-weight: 650; }

        .pri {
            margin-top: 20px;
            width: 100%;
            min-height: 56px;
            padding: 0 18px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, .4), rgba(255, 255, 255, .12));
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transition: transform .1s;
        }
        .pri:active { transform: scale(.97); }
        .pri.ghost { background: transparent; box-shadow: none; margin-top: 10px; }
        .pri.sec { margin-top: 10px; background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.06)); }

        .item .t small.loc { font-size: 12px; opacity: .85; letter-spacing: .02em; }
        .dup { margin: 10px 0 4px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); font-size: 15px; }
        .dup-h { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .dup-h .i { width: 18px; height: 18px; flex: none; }
        .dup.ok .dup-h { color: var(--ok); } .dup.warn .dup-h { color: var(--no); } .dup.bad .dup-h { color: var(--ac); }
        .dup-r { margin-top: 6px; } .dup-r small { display: block; font-size: 12px; opacity: .85; }
        .msg { color: #d6ffee; margin-top: 14px; min-height: 20px; text-align: center; font-weight: 500; }

        /* ---------- Настройки ---------- */
        .panel {
            padding: 4px 16px 16px;
            margin-bottom: 12px;
            border-radius: 24px;
            color: var(--ctx);
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
        }
        .panel label { color: var(--cmut); margin-left: 0; }

        .swatches { display: flex; flex-wrap: wrap; gap: 12px 4px; align-items: flex-start; }
        .swb { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; }
        .swb > span { font-size: 12px; font-weight: 650; line-height: 1.15; text-align: center; color: var(--cmut); }
        .cur { font-size: 15px; color: var(--cmut); margin: -4px 0 12px; }
        .cur b { color: var(--ctx); font-weight: 800; }
        .hint2 { font-size: 14px; color: var(--cmut); margin: 0 0 12px; line-height: 1.35; }

        /* Предпросмотр: как будет выглядеть карточка на выбранном фоне */
        .pv { position: relative; isolation: isolate; overflow: hidden; border-radius: 24px; padding: 14px 16px 18px; margin-bottom: 12px; background: var(--bg-color); border: 1px solid var(--bd); }
        .pv::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--bg-img) center / cover no-repeat; }
        .pv::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--bg-color); opacity: var(--tint); }
        .pv-cap { font-size: 13px; font-weight: 700; color: var(--tx); text-align: center; margin-bottom: 10px; }
        .pv-card { border-radius: 22px; padding: 16px 16px 22px; text-align: center; background: var(--glass); border: 1px solid var(--bd); box-shadow: var(--edge); color: var(--ctx); text-shadow: var(--ctsh); }
        .pv-card small { display: block; text-align: left; font-size: 13px; font-weight: 700; color: var(--cmut); }
        .pv-card b { display: block; font-size: 30px; font-weight: 800; margin-top: 6px; }
        .pv-card span { display: block; font-size: 22px; font-weight: 650; margin-top: 4px; }

        /* Переключатель «Сплошной цвет / Фото» */
        .seg { display: flex; gap: 4px; padding: 4px; margin: 10px 0 14px; border-radius: 18px; background: rgba(0, 20, 60, .28); }
        .seg button { flex: 1; min-height: 46px; padding: 0 8px; border: 0; border-radius: 14px; background: transparent; color: var(--ctx); font-size: 15px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: .2s; }
        .seg { position: relative; }
        .seg button { position: relative; z-index: 1; }
        .seg button.on { background: transparent; }
        .seg:not(:has(.ind.ready)) button.on { background: rgba(255, 255, 255, .38); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 2px 8px rgba(0, 30, 90, .25); }

        .sw {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .55);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 30, 90, .3);
            background-clip: padding-box;
            flex: none;
        }
        /* Кнопки выбора (тема / режим) */
        .pick { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 14px 8px 16px; border-radius: 16px; cursor: pointer; text-align: left; color: var(--ctx); transition: transform .12s; min-width: 0; }
        .pick:active { transform: scale(.98); }
        .pick .pk-t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
        .pick .pk-l { font-size: 12px; font-weight: 700; color: var(--cmut); letter-spacing: .05em; text-transform: uppercase; }
        .pick .pk-v { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pick .i { transition: transform .3s cubic-bezier(.2, .9, .3, 1); }
        .pick.open .i { transform: rotate(180deg); }

        /* Нижняя панель выбора */
        .sheet { position: fixed; inset: 0; z-index: 500; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
        .sheet.show { pointer-events: auto; }
        .sh-bd { position: absolute; inset: 0; background: rgba(0, 15, 45, .45); opacity: 0; transition: opacity .3s ease; }
        .sheet.show .sh-bd { opacity: 1; }
        .sh-pn {
            --ctx: #fff; --cmut: rgba(255, 255, 255, .85); --ctsh: var(--tsh);
            position: relative;
            width: calc(100% - 16px);
            max-width: 544px;
            margin: 0 8px calc(8px + env(safe-area-inset-bottom, 0px));
            max-height: 78vh; max-height: 78dvh;
            display: flex; flex-direction: column;
            border-radius: 30px;
            color: #fff;
            text-shadow: var(--tsh);
            background: linear-gradient(rgba(8, 28, 70, .66), rgba(8, 28, 70, .66)), var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transform: translateY(112%);
            transition: transform .4s cubic-bezier(.2, .9, .25, 1.05);
        }
        .sheet.show .sh-pn { transform: none; }
        .sh-pn.drag { transition: none; }
        .sh-hd { padding: 10px 22px 4px; touch-action: none; }
        .sh-grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .55); margin: 0 auto 12px; }
        .sh-t { font-size: 20px; font-weight: 800; margin: 2px 0 6px; }
        .sh-l { overflow-y: auto; padding: 4px 10px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .opt {
            display: flex; align-items: center; gap: 12px;
            width: 100%; min-height: 60px; padding: 10px 14px; margin: 0 0 6px;
            border: 1px solid transparent; border-radius: 20px;
            background: transparent; color: #fff; text-align: left; cursor: pointer;
            opacity: 0;
            animation: optIn .4s cubic-bezier(.2, .9, .3, 1) forwards;
            animation-delay: calc(140ms + var(--k, 0) * 34ms);
            transition: background .2s, border-color .2s, transform .1s;
        }
        .opt:active { transform: scale(.98); }
        .opt { position: relative; z-index: 1; }
        .opt.on { background: transparent; }
        .op-i { flex: none; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 4px; background: rgba(255, 255, 255, .14); }
        .op-i .dot { width: 10px; height: 10px; margin: 0; }
        .op-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .op-t b { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
        .op-t small { font-size: 13px; color: rgba(255, 255, 255, .8); font-weight: 500; margin-top: 1px; }
        .opt em { flex: none; font-style: normal; font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, .9); background: rgba(255, 255, 255, .15); padding: 2px 10px; border-radius: 999px; }
        .op-c { flex: none; width: 24px; display: flex; justify-content: center; }
        .op-c .i { width: 22px; height: 22px; stroke-width: 3; color: var(--ok); }
        @keyframes optIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        body.sheet-open { overflow: hidden; }

        /* Темы-«чипсы» при добавлении карточки */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
        .chip { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 650; cursor: pointer; color: var(--ctx); text-shadow: var(--ctsh); background: var(--glass); border: 1px solid var(--bd); box-shadow: var(--edge); transition: transform .12s, background .2s; }
        .chip:active { transform: scale(.95); }
        .chip.on { background: linear-gradient(rgba(255, 255, 255, .38), rgba(255, 255, 255, .38)), var(--glass); border-color: rgba(255, 255, 255, .8); }

        /* Награды за серию правильных ответов */
        .streak { display: inline-flex; align-items: center; gap: 5px; padding: 2px 11px; border-radius: 999px; font-weight: 800; color: #fff; background: rgba(255, 176, 77, .28); border: 1px solid rgba(255, 176, 77, .65); box-shadow: 0 0 14px rgba(255, 176, 77, .35); }
        .streak .i { width: 1.05em; height: 1.05em; color: #ffd08a; }
        .streak.pop { animation: streakPop .5s cubic-bezier(.2, 1.4, .4, 1); }
        @keyframes streakPop { 0% { transform: scale(.6); opacity: .4; } 60% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }

        .rise { position: fixed; left: 50%; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); width: min(62vw, 250px); z-index: 9; pointer-events: none; transform: translate(-50%, 135%); transition: transform .65s cubic-bezier(.2, 1.25, .3, 1); }
        .rise.show { transform: translate(-50%, 0); }
        .rise svg { display: block; width: 100%; height: auto; transform-origin: 50% 100%; animation: wob 1.1s ease-in-out infinite alternate; }
        @keyframes wob { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
        .rise-b { position: absolute; left: 50%; bottom: calc(100% - 6px); transform: translateX(-50%); width: max-content; max-width: 84vw; padding: 8px 18px 9px; border-radius: 18px; background: rgba(255, 255, 255, .95); color: #5a6090; text-align: center; text-shadow: none; box-shadow: 0 6px 16px rgba(0, 30, 90, .25); }
        .rise-b b { display: block; font-size: 18px; font-weight: 800; }
        .rise-b span { display: block; font-size: 14px; font-weight: 700; color: #7a7fa6; margin-top: 1px; }
        .rise-b::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px; background: inherit; transform: rotate(45deg); border-radius: 3px; }
        .chd { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(8, 28, 70, .45); opacity: 0; transition: opacity .35s; }
        .chd.show { opacity: 1; }
        .chd-c { width: min(360px, 100%); text-align: center; padding: 18px 20px 22px; border-radius: 28px; background: var(--glass); border: 1px solid var(--bd); box-shadow: var(--edge); transform: translateY(24px) scale(.94); transition: transform .5s cubic-bezier(.2, 1.2, .3, 1); }
        .chd.show .chd-c { transform: none; }
        .chd-c svg { width: min(250px, 72%); height: auto; animation: floaty 2.6s ease-in-out infinite alternate; }
        .chd-c b { display: block; font-size: 24px; font-weight: 800; margin-top: 4px; }
        .chd-c em { display: block; font-style: normal; font-weight: 600; color: var(--cmut); margin-top: 2px; }
        .chd-c p { margin: 10px 0 16px; font-size: 16px; }

        /* Брызги-капли при награде */
        .drop { position: fixed; z-index: 390; width: var(--s, 12px); height: var(--s, 12px); margin: calc(var(--s, 12px) / -2) 0 0 calc(var(--s, 12px) / -2); border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, .95), rgba(255, 255, 255, .35) 45%, rgba(190, 225, 255, .18) 75%); border: 1px solid rgba(255, 255, 255, .7);  animation: dropOut 1s cubic-bezier(.15, .8, .3, 1) forwards; }
        @keyframes dropOut { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
        .fin-note { font-size: 17px; font-weight: 650; color: var(--tx); margin: -4px 0 10px; }

        /* Иконки: единый линейный стиль, цвет берут от текста */
        :root { --icf: drop-shadow(0 1px 2px rgba(0, 20, 60, .5)); }
        .i { width: 1.2em; height: 1.2em; display: inline-block; vertical-align: -.22em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        nav button .i { width: 22px; height: 22px; }
        .ib .i { width: 24px; height: 24px; }
        .sm .i { width: 20px; height: 20px; stroke-width: 2.6; }
        .sm.ok { color: var(--ok); }
        .sm.no { color: var(--no); }
        .pri .i, .seg button .i, .panel label .i { margin-right: 7px; }
        .panel label .i { vertical-align: -.28em; }
        .empty .i { width: 46px; height: 46px; margin-bottom: 12px; stroke-width: 1.6; }
        .swipe-tip .i { width: 1em; height: 1em; vertical-align: -.15em; }
        .stats .dot { display: inline-block; width: 11px; height: 11px; margin: 0 6px 0 0; vertical-align: -1px; }
        .dot.n { background: rgba(255, 255, 255, .8); }
        .sw .i { width: 22px; height: 22px; stroke-width: 3; }
        .sw { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: 800; text-shadow: 0 1px 3px rgba(0, 0, 0, .55); }
        .sw.on { outline: 3px solid #fff; outline-offset: 2px; }
        .sw-custom.on { outline: 3px solid #fff; outline-offset: 2px; }
        .sw.none { background: linear-gradient(135deg, #fff 46%, #f33 46%, #f33 54%, #fff 54%); }

        /* Круглый выбор своего цвета (раньше appearance:none делал его невидимым на телефонах) */
        .sw-custom {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .55);
            background: conic-gradient(#f66, #fd5, #6e8, #5cf, #a6f, #f66);
            overflow: hidden;
            flex: none;
        }
        .sw-custom input[type="color"] {
            position: absolute;
            inset: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            opacity: 0;
            cursor: pointer;
            border: 0;
            padding: 0;
        }

        .file-btn { position: relative; display: block; margin-top: 4px; }
        .file-btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
        .file-btn .pri { margin-top: 0; pointer-events: none; }

        .bg-preview {
            height: 120px;
            border-radius: 18px;
            margin-top: 12px;
            border: 1px solid var(--bd);
            background: center / cover no-repeat;
        }

        @media (max-width: 380px) {
            .card .big { font-size: 30px; }
            .card .ans { font-size: 24px; }
            nav button { font-size: 14px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .opt { animation: none; opacity: 1; } .drop { display: none; } .streak.pop { animation: none; } }

        /* ===== Транскрипция, список и поиск ===== */
        .card .tr { margin-top: 8px; font-size: 21px; font-weight: 600; color: var(--cmut); letter-spacing: .01em; }
        .item { content-visibility: auto; contain-intrinsic-size: auto 150px; flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 14px 12px 16px; }
        .it-main { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
        .it-main .dot { margin: 9px 0 0; }
        .it-main .t { flex: 1; min-width: 0; font-weight: 400; }

        /* ===== Производительность ===== */
        nav, .sh-pn { -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }   /* размытие — только у нижнего меню и панели выбора */
        .more { margin-top: 6px; }
        .aex { margin: 6px 2px 0; }
        .aex .lk-ok i { font-style: normal; font-size: 14px; opacity: .9; }
        /* Быстрый режим: без размытия, лишних теней и бесконечных анимаций */
        html.lite { --blur: none; --tsh: 0 1px 1px rgba(0, 20, 60, .5); --edge: inset 0 1px 0 rgba(255, 255, 255, .35); }
        html.lite nav, html.lite .sh-pn { -webkit-backdrop-filter: none; backdrop-filter: none; }

        html.lite h1.logo img, html.lite .rise svg, html.lite .chd-c svg, html.lite .streak.pop, html.lite .gm-m.hop, html.lite .gm-m.wob { animation: none; }
        html.lite .opt { animation: none; opacity: 1; }
        html.lite .drop { display: none; }
        html.lite *, html.lite *::before, html.lite *::after { transition-duration: .12s !important; }

        /* ===== Подсказки словаря при добавлении слова ===== */
        .lk { margin: 8px 4px 0; font-size: 14px; line-height: 1.35; color: var(--mut); overflow-wrap: anywhere; }

        .lk-chip small { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--cmut); }
        .lk-chip:active { transform: scale(.97); }

        /* ===== Кот и переворот карточки ===== */
        .cat-w { transform-box: fill-box; transform-origin: 50% 100%; animation: catSway 2.6s ease-in-out infinite; }
        @keyframes catSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
        .card.flip-out { animation: flipOut .17s ease-in forwards; transform-origin: 50% 50%; pointer-events: none; }
        .card.flip-in { animation: flipIn .26s cubic-bezier(.2, .9, .3, 1.15); transform-origin: 50% 50%; }
        @keyframes flipOut { from { transform: perspective(900px) rotateY(0); filter: brightness(1); } to { transform: perspective(900px) rotateY(90deg); filter: brightness(.82); } }
        @keyframes flipIn { from { transform: perspective(900px) rotateY(-90deg); filter: brightness(.82); } to { transform: perspective(900px) rotateY(0); filter: brightness(1); } }
        html.lite .cat-w { animation: none; }

        /* ===== Сцены в играх ===== */
        .gm-sv { position: relative; flex: none; width: 150px; aspect-ratio: 150 / 132; border-radius: 28px; overflow: hidden; border: 1px solid var(--bd); box-shadow: var(--edge); background: var(--glass); color: var(--ctx); }

        .gm-sv svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        @keyframes scnSwap { 0% { opacity: 0; transform: translateX(-14px) scale(.92); } 60% { opacity: 1; transform: translateX(3px) scale(1.02); } 100% { transform: none; } }

        @media (prefers-reduced-motion: reduce) { .gm-sv.hop, .gm-sv.wob, .gm-sv.swap { animation: none; } }
    
        /* ---------- Подсказки: узнаваемый шрифт и цвет, читаются на любом фоне ---------- */
        .card .hint, .hint2, .gm-hint {
            font-family: "Russo One", system-ui, -apple-system, "SF Pro Display", Segoe UI, Roboto, sans-serif;
            font-weight: 700;
            letter-spacing: .01em;

            backdrop-filter: blur(8px);

            line-height: 1.35;

        /* ---------- Нижняя панель: кнопка «перетекает» между вкладками ---------- */
        nav .ind { position: absolute; top: 6px; bottom: 6px; left: 0; right: 0; border-radius: 999px; background: rgba(255, 255, 255, .3); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 2px 10px rgba(0, 30, 90, .25); pointer-events: none; z-index: 0; opacity: 0; }

        /* ---------- Переход между вкладками ---------- */
        main { position: relative; }
        @keyframes tinR { from { opacity: 0; transform: translateX(34px) scale(.985); } }
        @keyframes tinL { from { opacity: 0; transform: translateX(-34px) scale(.985); } }
        @keyframes toutL { to { opacity: 0; transform: translateX(-34px) scale(.985); } }
        @keyframes toutR { to { opacity: 0; transform: translateX(34px) scale(.985); } }
        #v.tin-r { animation: tinR .36s cubic-bezier(.2, .85, .25, 1) backwards; }

        .pri.ghost.reset-look { background: rgba(8, 24, 60, .66); border: 1px solid rgba(255, 255, 255, .5); color: #fff; margin-top: 14px; }
        html.lite .sm.del, html.lite .pri.ghost.del-cur, html.lite .pri.ghost.reset-look { -webkit-backdrop-filter: none; backdrop-filter: none; }

        /* ---------- Иконки тем, кнопка «Назад» ---------- */
        .pk-v .i { width: 17px; height: 17px; margin-right: 6px; vertical-align: -3px; }
        .row.cmp .pick .pk-v .i { width: 15px; height: 15px; margin-right: 4px; vertical-align: -2px; }
        .chip .i { width: 17px; height: 17px; margin-right: 6px; vertical-align: -3px; }
        .card .cat .i { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; }
        .mini.undo-mini { display: flex; align-items: center; justify-content: center; white-space: nowrap; width: auto; padding: 0 12px 0 10px; gap: 5px; font-size: 14px; font-weight: 800; color: #ffe8a3; text-shadow: 0 1px 2px rgba(0, 10, 40, .85); background: rgba(8, 24, 60, .66); border: 1px solid rgba(255, 232, 163, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
        .mini.undo-mini .i { width: 18px; height: 18px; color: #ffd36b; }
        html.lite .mini.undo-mini { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(8, 24, 60, .8); }

        /* ---------- Кнопка-«капля» в переключателях и списках ---------- */
        .seg .ind { position: absolute; top: 4px; bottom: 4px; left: 0; right: 0; border-radius: 14px; background: rgba(255, 255, 255, .38); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 2px 8px rgba(0, 30, 90, .25); pointer-events: none; z-index: 0; opacity: 0; }
        .sh-l { position: relative; }
        .sh-l .ind { position: absolute; left: 10px; right: 10px; top: 0; bottom: 0; border-radius: 20px; background: rgba(255, 255, 255, .22); border: 1px solid rgba(255, 255, 255, .5); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .55), 0 2px 10px rgba(0, 30, 90, .25); pointer-events: none; z-index: 0; opacity: 0; }
        .seg .ind.ready, .sh-l .ind.ready { opacity: 1; }
        @media (prefers-reduced-motion: reduce) { .seg .ind, .sh-l .ind { transition: none !important; } }

        /* ---------- Проведение пальцем по спискам выбора ---------- */
        .sh-l { touch-action: pan-y; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .sh-l.scrub .ind { background: rgba(255, 255, 255, .32); box-shadow: 0 0 0 2px rgba(255, 255, 255, .4), 0 4px 18px rgba(0, 30, 90, .4); }

        .mini.undo-mini.under { height: 38px; margin: -22px auto 0; position: relative; z-index: 4; }
        .mini.undo-mini.under.off { visibility: hidden; pointer-events: none; }
        @media (max-height: 860px) { .card { min-height: min(37dvh, 300px); } }

        /* ---------- Цель дня выполнена: плашка исчезает ---------- */
        @keyframes goalOut { 0% { opacity: 1; max-height: 90px; transform: none; } 45% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: -12px; border-width: 0; transform: scale(.94); } }
        .goal.gone { overflow: hidden; animation: goalOut .85s ease-in-out .1s forwards; }
        html.lite .goal.gone { display: none; }

        /* ---------- Экран «Как работают повторения» ---------- */
        .chd-c.wide { background: linear-gradient(160deg, rgba(20, 52, 112, .97), rgba(8, 26, 66, .97)); width: min(400px, 100%); max-height: 88dvh; overflow-y: auto; text-align: left; padding: 20px 18px 18px; }
        .chd-c.wide .sr-h { font-size: 21px; margin: 0 0 4px; }
        .chd-c.wide .sr-h2 { font-size: 17px; margin: 18px 0 8px; }
        .sr-p { margin: 6px 0 12px !important; font-size: 15px !important; line-height: 1.4; }
        .sr-p b { display: inline !important; font-size: inherit !important; margin: 0 !important; }
        .sr-tl { position: relative; margin: 6px 0 4px; }
        .sr-tl::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: linear-gradient(#4cd9a0, #ffd36b, #ff9f5c); opacity: .75; }
        .sr-st { position: relative; display: flex; align-items: center; gap: 12px; padding: 7px 0; opacity: 0; transform: translateY(10px); animation: srIn .5s cubic-bezier(.2, .9, .3, 1) forwards; animation-delay: calc(var(--k) * .3s + .15s); }
        .sr-st > i { flex: none; width: 33px; height: 33px; display: grid; place-items: center; border-radius: 50%; font-style: normal; font-weight: 800; background: rgba(8, 24, 60, .8); border: 2px solid #ffd36b; color: #ffe8a3; z-index: 1; }
        .sr-st:first-child > i { border-color: #4cd9a0; color: #4cd9a0; }
        .sr-st b { display: block; font-size: 16px !important; margin: 0 !important; }
        .sr-st small { display: block; font-size: 13px; opacity: .8; }
        @keyframes srIn { to { opacity: 1; transform: none; } }
        .sr-bad { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 0; padding: 10px 12px; border-radius: 14px; background: rgba(110, 16, 28, .45); border: 1px solid rgba(255, 140, 140, .55); font-size: 14px; line-height: 1.4; }
        .sr-bad .i { width: 20px; height: 20px; flex: none; margin-top: 1px; color: #ffb3b3; }
        .sr-bad b { display: inline !important; font-size: 14px !important; margin: 0 !important; }
        .sr-bar { display: grid; grid-template-columns: 132px 1fr 28px; white-space: nowrap; gap: 8px; align-items: center; font-size: 14px; margin: 5px 0; }
        .sr-bar > div { height: 10px; border-radius: 99px; background: rgba(0, 20, 60, .4); overflow: hidden; }
        .sr-bar i { display: block; height: 100%; width: var(--w); border-radius: 99px; background: linear-gradient(90deg, #ffd36b, #ff9f5c); animation: srW .8s cubic-bezier(.2, .9, .3, 1) .5s backwards; }
        .sr-bar:first-child i { background: linear-gradient(90deg, #4cd9a0, #8af0c8); }
        .sr-bar b { display: block !important; font-size: 14px !important; margin: 0 !important; text-align: right; }
        @keyframes srW { from { width: 0; } }
        .chd-c.wide .pri { margin-top: 14px; }
        .pri.ghost.sr-open { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 10px 0 6px; font-weight: 700; color: #ffe8a3; background: rgba(8, 24, 60, .66); border: 1px solid rgba(255, 232, 163, .5); text-shadow: 0 1px 2px rgba(0, 10, 40, .8); }
        html.lite .sr-st { animation-duration: .01s; animation-delay: 0s; }
        @media (prefers-reduced-motion: reduce) { .sr-st, .sr-bar i { animation: none !important; opacity: 1; transform: none; } }

        /* ===== Оптимизация отрисовки: вид прежний, нагрузка на телефон меньше ===== */
        :root { --edge-s: inset 0 1px 1px rgba(255, 255, 255, .5), 0 2px 7px rgba(0, 30, 90, .2); }
        html.lite { --edge-s: var(--edge); }
        body { text-rendering: auto; }                                   /* optimizeLegibility заметно замедляет вёрстку текста на телефонах */
        body::before, body::after { will-change: transform; transform: translateZ(0); }   /* неподвижный фон — отдельным слоем, без перерисовки при прокрутке */
        .item, .gm-opt, .gm-p, .gm-lt, .lk-chip, .gm-tile, .opt, .pick, .act button { box-shadow: var(--edge-s); }   /* у повторяющихся элементов тень компактнее */
        .item .t, .item .t * { text-shadow: none; }                      /* в длинном списке тень у каждой буквы не нужна */
        /* переворот карточки: без анимации filter (она перерисовывает карточку на каждом кадре) */
        @keyframes flipOut { from { transform: perspective(900px) rotateY(0); } to { transform: perspective(900px) rotateY(90deg); } }
        @keyframes flipIn { from { transform: perspective(900px) rotateY(-90deg); } to { transform: perspective(900px) rotateY(0); } }
        .cat-w { animation-iteration-count: 2; }                        /* покачивание — пара раз, а не вечно: нет постоянной перерисовки */
        /* запуск: пока идёт заставка, приложение под ней не прорисовывается; свечение — без лишнего фильтра (градиент и так мягкий) */
        body.splashing main, body.splashing nav { visibility: hidden; }
        #splash::before { filter: none; }

        /* ===== Карточка «парит» и по ней пробегает блик света ===== */
        /* анимируем отдельные свойства translate/scale и сдвиг блика — они складываются со свайпом и переворотом; всё это работает на видеокарте */
        @keyframes cardFloat {
            0%, 100% { translate: 0 0; scale: 1; }
            50% { translate: 0 -6px; scale: 1.012; }
        }
        @keyframes cardGlint {
            0%, 55% { translate: 0 0; opacity: 0; }
            62%, 90% { opacity: 1; }
            100% { translate: 560% 0; opacity: 0; }
        }
        /* начинается через пару секунд после появления карточки (задержка 2.5 с) и продолжается, пока она на экране */
        .card { animation: cardFloat 3.6s ease-in-out 2.5s infinite; }
        .card.enter { animation: cardIn .28s ease-out, cardFloat 3.6s ease-in-out 2.5s infinite; }
        .card.flip-in { animation: flipIn .26s cubic-bezier(.2, .9, .3, 1.15), cardFloat 3.6s ease-in-out 2.5s infinite; }
        .card::after { content: ""; position: absolute; top: -25%; bottom: -25%; left: -55%; width: 38%; pointer-events: none; opacity: 0;
            background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, .30) 50%, transparent 100%); transform: skewX(-18deg);
            animation: cardGlint 7s ease-in-out 3s infinite; }
        .card.drag, .card:active, .card.drag::after, .card:active::after { animation: none; }
        html.lite .card, html.lite .card::after { animation: none; }
        @media (prefers-reduced-motion: reduce) { .card, .card.enter, .card.flip-in, .card::after { animation: none; } }
    </style>
</head>

    <script>
    /* Заставка: логотип на картинке-фоне появляется, держится пару секунд и плавно исчезает. Касание — пропустить. */
    (function () {
        const el = document.getElementById('splash');
        document.body.classList.add('splashing');
        let done = false;
        function end() {
            if (done) return; done = true;
            el.classList.add('out');
            document.body.classList.remove('splashing');
            setTimeout(() => el.remove(), 800);
        }
        el.addEventListener('click', end);
        const bg = document.getElementById('intro-bg');
        el.style.backgroundImage = 'url(data:image/' + bg.dataset.fmt + ';base64,' + bg.textContent.trim() + ')';
        el.innerHTML = '<img alt="Карточки от Сани">';
        el.firstChild.src = 'data:image/webp;base64,' + document.getElementById('intro-logo').textContent.trim();
        setTimeout(end, 2200);
    })();
    </script>

                .filter(x => /^[A-ZÆØÅ]/.test(x.t) && /[.!?]$/.test(x.t) && x.t.split(/\s+/).length >= 3 && !/[А-Яа-яЁё]/.test(x.t));

        function aeBox(html) { const b = $('aex'); if (b) b.innerHTML = html; }
        function aeApply(i) {

            aeBox(`<div class="lk-ok">${ic('sparkles')} Пример ${i + 1} из ${AE.list.length} · ${AE_SRC[e.src]}${e.ru ? '<br><i>' + esc(e.ru) + '</i>' : ''}</div><div class="chips"><button type="button" class="chip" onclick="exNext()">${ic('shuffle')} Другой пример</button></div>`);
        }
        const aePick = (arr, src) => arr.filter(x => x.t.length >= 10 && x.t.length <= 90 && !AE.list.some(y => y.t === x.t) && exHas(x.t, AE.words, AE.forms))
            .sort((a, b) => (!b.ru - !a.ru) || exScore(a.t) - exScore(b.t)).slice(0, 4).map(x => ({ t: x.t, ru: x.ru, src }));
        async function aeMore() {
            if (!AE || AE.onl) return;

                if (!AE || AE.key !== key) return;

        async function autoEx() {

            const words = [...new Set([fold(typed), fold(base)].map(x => x.replace(EX_ART, '')).filter(x => x.length >= 2))];
            const forms = exForms(words);
            AE = { key, base, ru, words, forms, q: base.replace(/^å /i, '').replace(/^(en|ei|et)(\/(en|ei|et))? /i, '').trim() || typed, list: localEx(words, forms), i: -1, onl: false };
            if (ex.dataset.m === '1') { aeBox(''); return; }          // свой пример пользователя не трогаем

        let lkTimer = 0, lkSeq = 0, lkList = [];

        async function lookupRun() {
            const box = $('lk'), noEl = $('a-no'), ruEl = $('a-ru');
            if (!box || !noEl || !ruEl) return;
            const no = noEl.value.trim(), ruQ = ruEl.value.trim(), seq = ++lkSeq;

                box.innerHTML = s.length ? chipsHtml(s, 'Подсказки из словаря:') : '';

            const r = lookupWord(no);

        let armed = '', armT = 0;

        /* ---------- Рендер ---------- */
        const MODES = [

        /* ---------- Нижняя панель выбора ---------- */
        let shEl = null, shKind = '';
        function openPick(kind) {

                : kind === 'cat'

            const list = items.map((it, k) => `

                    <div class="sh-l"><span class="ind" aria-hidden="true"></span>${list}</div>
                </div>`;
            document.body.appendChild(shEl);
            document.body.classList.add('sheet-open');
            const btn = document.querySelector(`.pick[data-k="${kind}"]`); if (btn) btn.classList.add('open');
            shEl.getBoundingClientRect();                 // чтобы анимация выезда сработала
            requestAnimationFrame(() => shEl && shEl.classList.add('show'));
            { const l = shEl.querySelector('.sh-l'), on = l.querySelector('.opt.on'), ind = l.querySelector('.ind'); if (on) { flowPlace(ind, l, on, 'y', false); l.scrollTop = Math.max(0, on.offsetTop - l.clientHeight / 2 + on.offsetHeight / 2); } pickScrub(shEl); }

            // свайп вниз по шапке закрывает панель
            const pn = shEl.querySelector('.sh-pn'), bd = shEl.querySelector('.sh-bd'), hd = shEl.querySelector('.sh-hd');
            let y0 = 0, dy = 0;
            hd.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; pn.classList.add('drag'); }, { passive: true });
            hd.addEventListener('touchmove', e => {
                dy = Math.max(0, e.touches[0].clientY - y0);
                pn.style.transform = `translateY(${dy}px)`;
                bd.style.opacity = Math.max(0, 1 - dy / 300);
            }, { passive: true });
            hd.addEventListener('touchend', () => {
                pn.classList.remove('drag');
                if (dy > 90) { closePick(); }
                else { pn.style.transform = ''; bd.style.opacity = ''; }

        }
        function closePick() {
            if (!shEl) return;
            const el = shEl; shEl = null;
            el.classList.remove('show');
            el.querySelector('.sh-pn').style.transform = '';
            el.querySelector('.sh-bd').style.opacity = '';
            document.body.classList.remove('sheet-open');
            document.querySelectorAll('.pick.open').forEach(b => b.classList.remove('open'));
            setTimeout(() => el.remove(), 420);
        }
        /* ---------- «Перетекающая» кнопка выбора — как в нижней панели: списки глав/тем/режимов и переключатели ---------- */
        function flowPlace(ind, host, el, axis, animate, back) {
            const x = axis === 'x', A = x ? 'left' : 'top', B = x ? 'right' : 'bottom';
            const a = x ? el.offsetLeft : el.offsetTop, len = x ? el.offsetWidth : el.offsetHeight, hl = x ? host.clientWidth : host.clientHeight;
            const lead = '.26s cubic-bezier(.3, 1.15, .4, 1)', lag = '.48s cubic-bezier(.25, 1, .35, 1) .04s';
            ind.style.transition = animate ? (back ? `${A} ${lead}, ${B} ${lag}` : `${A} ${lag}, ${B} ${lead}`) : 'none';
            ind.style[A] = a + 'px'; ind.style[B] = (hl - a - len) + 'px';
            ind.classList.add('ready');
            return { a, b: hl - a - len, w: hl };
        }
        const segPos = {};
        function liquidSegs() {
            document.querySelectorAll('#v .seg').forEach((seg, n) => {
                const on = seg.querySelector('button.on');
                if (!on) return;
                let ind = seg.querySelector('.ind');
                if (!ind) { ind = document.createElement('span'); ind.className = 'ind'; ind.setAttribute('aria-hidden', 'true'); seg.prepend(ind); }
                const key = tab + ':' + n, prev = segPos[key], a = on.offsetLeft;
                if (prev && prev.w === seg.clientWidth && prev.a !== a && !isLite() && !reduceMotion()) {
                    ind.style.transition = 'none'; ind.style.left = prev.a + 'px'; ind.style.right = prev.b + 'px'; ind.classList.add('ready');
                    void ind.offsetWidth;
                    segPos[key] = flowPlace(ind, seg, on, 'x', true, a < prev.a);
                } else segPos[key] = flowPlace(ind, seg, on, 'x', false);
            });
        }
        new MutationObserver(() => requestAnimationFrame(liquidSegs)).observe($('v'), { childList: true });

        let picking = false;
        function choosePick(v) {
            const o = shEl && [...shEl.querySelectorAll('.opt')].find(x => x.dataset.v === v), ind = shEl && shEl.querySelector('.sh-l .ind');
            if (picking) return;
            if (!o || !ind || isLite() || reduceMotion()) return applyPick(v);
            picking = true;
            const old = shEl.querySelector('.opt.on');
            shEl.querySelectorAll('.opt.on').forEach(x => x.classList.remove('on'));
            o.classList.add('on');
            flowPlace(ind, shEl.querySelector('.sh-l'), o, 'y', true, !!old && o.offsetTop < old.offsetTop);
            try { tg?.HapticFeedback?.selectionChanged(); } catch (_) {}
            setTimeout(() => { picking = false; if (shEl) applyPick(v); }, 380);
        }
        /* Проведение пальцем по списку выбирает пункты; у верхнего и нижнего края список сам прокручивается */
        function pickScrub(sh) {
            const l = sh.querySelector('.sh-l'), ind = l.querySelector('.ind');
            let down = false, cur = null, py = 0, raf = 0;
            const optAt = y => {
                const r = l.getBoundingClientRect(), el = document.elementFromPoint(r.left + r.width / 2, Math.min(Math.max(y, r.top + 2), r.bottom - 2));
                const o = el && el.closest ? el.closest('.opt') : null;
                if (o) return o;
                const cy = Math.min(Math.max(y, r.top + 2), r.bottom - 2);       // палец в зазоре между пунктами — берём ближайший
                let best = null, bd = 1e9;
                l.querySelectorAll('.opt').forEach(x => { const b = x.getBoundingClientRect(), d = Math.abs((b.top + b.bottom) / 2 - cy); if (d < bd) { bd = d; best = x; } });
                return best;
            };
            const hl = o => {
                if (!o || o === cur) return;
                const prevTop = cur ? cur.offsetTop : (l.querySelector('.opt.on') || o).offsetTop;
                cur = o;
                l.querySelectorAll('.opt.on').forEach(x => x.classList.remove('on'));
                o.classList.add('on');
                flowPlace(ind, l, o, 'y', !isLite() && !reduceMotion(), o.offsetTop < prevTop);
                try { tg?.HapticFeedback?.selectionChanged(); } catch (_) {}
            };
            const tick = () => {
                if (!down || !document.body.contains(l)) return;
                const r = l.getBoundingClientRect(), zone = 60;
                let v = 0;
                if (py < r.top + zone) v = -Math.min(1, (r.top + zone - py) / zone);
                else if (py > r.bottom - zone) v = Math.min(1, (py - (r.bottom - zone)) / zone);
                if (v && l.scrollHeight > l.clientHeight) { l.scrollTop += v * 16; hl(optAt(py)); }
                raf = requestAnimationFrame(tick);
            };
            let hold = 0, scrub = false, x0 = 0, y0 = 0;
            const begin = () => {
                scrub = true; l.classList.add('scrub'); hl(optAt(py));
                try { tg?.HapticFeedback?.impactOccurred('light'); } catch (_) {}
                cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
            };
            l.addEventListener('pointerdown', e => {
                if (picking) return;
                down = true; scrub = false; cur = null; py = y0 = e.clientY; x0 = e.clientX;
                if (e.pointerType === 'mouse') { try { l.setPointerCapture(e.pointerId); } catch (_) {} begin(); }   // мышью обычной прокрутки пальцем нет — сразу выбор
                else hold = setTimeout(begin, 230);                                                                  // пальцем: удержание включает режим выбора
            });
            l.addEventListener('pointermove', e => {
                if (!down) return;
                py = e.clientY;
                if (!scrub) { if (Math.hypot(e.clientX - x0, e.clientY - y0) > 8) clearTimeout(hold); return; }        // сдвинулся до удержания — это обычная прокрутка
                hl(optAt(py));
            });
            l.addEventListener('touchmove', e => { if (scrub && e.cancelable) e.preventDefault(); }, { passive: false });
            l.addEventListener('contextmenu', e => e.preventDefault());
            const end = e => {
                clearTimeout(hold);
                if (!down) return;
                down = false; cancelAnimationFrame(raf); l.classList.remove('scrub');
                const was = scrub; scrub = false;
                if (was && e.type === 'pointerup' && cur) choosePick(cur.dataset.v);
            };
            l.addEventListener('pointerup', end); l.addEventListener('pointercancel', end);
        }

        function applyPick(v) {

        const BG_COLORS = [['#1e7fd8', 'Синий'], ['#0f766e', 'Бирюзовый'], ['#15803d', 'Зелёный'], ['#7c3aed', 'Фиолетовый'], ['#be185d', 'Малиновый'], ['#b45309', 'Янтарный'], ['#111827', 'Графит']];
        const swatches = (list, isOn, fn) => list.map(([c, n]) => { const on = isOn(c); return `<div class="swb"><button class="sw ${on ? 'on' : ''}" style="background:${c};${c === '#ffffff' ? 'color:#10243a;text-shadow:none;' : ''}" aria-label="${n}" onclick="${fn}('${c}')">${on ? ic('check') : ''}</button><span>${n}</span></div>`; }).join('');
        const picker = (key, val, on) => `<div class="swb"><div class="sw-custom ${on ? 'on' : ''}" style="${on ? 'background:' + val : ''}"><input type="color" value="${val}" aria-label="Свой цвет" oninput="S.${key}=this.value;applyTheme()" onchange="save();render()"></div><span>Свой</span></div>`;
        const colorName = (list, c, auto) => { const f = list.find(x => x[0] === c); return f ? f[1] : (c ? 'Свой цвет ' + c : auto); };

        function render() {
            ['study', 'list', 'add', 'games', 'settings'].forEach(t => { const el = $('t-' + t); if (el) el.className = t === tab ? 'on' : ''; });
            moveInd();

            let h = '';

            if (tab === 'study') {
                h += `
                <div class="row cmp">
                    <button class="pick" data-k="ch" onclick="openPick('ch')"><span class="pk-t"><span class="pk-l">Глава</span><span class="pk-v">${esc(chap === '' ? 'Главы' : (+chap ? 'Гл. ' + chap : CHAPTERS[chap]))}</span></span>${ic('chevron')}</button>
                    <button class="pick" data-k="cat" onclick="openPick('cat')"><span class="pk-t"><span class="pk-l">Тема</span><span class="pk-v">${topicIc(cat)}${esc(cat || 'Темы')}</span></span>${ic('chevron')}</button>
                    <button class="pick" data-k="mode" onclick="openPick('mode')"><span class="pk-t"><span class="pk-l">Показывать</span><span class="pk-v">${esc(MODE_SHORT[mode] || '')}</span></span>${ic('chevron')}</button>
                </div>

                ${goalHit() ? (Date.now() < goalFxUntil ? `<div class="goal done gone"><div class="goal-t"><span>Цель дня выполнена!</span><b>${S.goal} / ${S.goal}</b></div><div class="goal-b"><i style="width:100%"></i></div></div>` : '') : `<div class="goal ${todayN() >= S.goal ? 'done' : ''}"><div class="goal-t"><span>Цель дня</span><b>${todayN()} / ${S.goal}</b></div><div class="goal-b"><i style="width:${Math.min(100, todayN() / S.goal * 100)}%"></i></div></div>`}
                ${mode !== 'due' && cards().some(isDue) ? `<button class="due" onclick="mode='due';build();render()">${ic('flame')}<span>Пора повторить: <b>${cards().filter(isDue).length}</b></span><em>Начать</em></button>` : ''}

                        ${swatches(CARD_COLORS, c => c === cc, 'setCard')}

                        <button class="${solid ? 'on' : ''}" onclick="setBgMode('color')">${ic('drop')}Сплошной цвет</button>

                    ` : `
                        ${BG ? `<div class="bg-preview" style="background-image:url('${BG}');margin-top:0"></div>` : `<div class="hint2">Сейчас стандартное фото. Можно выбрать своё.</div>`}

            enter = false; flipFx = false; streakPop = false;
            if (moreIO) { moreIO.disconnect(); moreIO = null; }
            $('v').innerHTML = h;
            if (tab === 'list') watchMore();
        }

        let flipFx = false, flipping = false;
        function doFlip() {
            const c = document.querySelector('.card');
            const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!c || flipping || calm) { flip = !flip; render(); return; }
            flipping = true;
            c.classList.add('flip-out');
            setTimeout(() => { flip = !flip; flipFx = true; flipping = false; render(); }, 170);
        }
        function tap() { if (swiped || busy || flipping) return; doFlip(); }

        function add() {
            const no = $('a-no').value.trim(), ru = $('a-ru').value.trim();
            if (!no || !ru) { msg = 'Заполните оба поля'; render(); return; }
            const d = findDup(no, ru), key = norm(no) + '|' + ru.toLowerCase();
            if (d.exact.length && dupArm !== key) {
                dupArm = key;
                msg = 'Это слово уже есть (' + loc(d.exact[0]) + '). Нажмите ещё раз, если всё равно хотите добавить.';
                render(); $('a-no').value = no; $('a-ru').value = ru; chkDup(); trFill(); dupArm = key; return;
            }
            dupArm = '';
            S.cu.push({ id: 'c' + Date.now(), no, ru, tr: $('a-tr').value.trim() || autoTr(no), cat: $('a-cat').value.trim() || 'Мои слова', ex: $('a-ex').value.trim(), ch: +chap || 0 });
            save(); AE = null;
            msg = ic('check') + ' Добавлено! Всего карточек: ' + cards().length;
            render();
            $('a-no').focus();
        }

        /* ---------- Мини-игры с персонажем ---------- */
        let G = null, gmMsg = '', gTimer = 0;
        const GAMES = [
            ['quiz', 'Выбери перевод', 'Угадай значение слова из четырёх вариантов', 'cards'],
            ['pairs', 'Найди пару', 'Соедини норвежские слова с их переводами', 'shuffle'],
            ['build', 'Собери слово', 'Составь слово из букв по русскому переводу', 'tag'],
            ['blitz', 'Блиц: верно или нет', '40 секунд и три жизни — отвечай быстро', 'flame']
        ];
        const G_OK = [['Så flott!', 'Здорово!'], ['Bra jobba!', 'Отлично!'], ['Riktig!', 'Верно!'], ['Supert!', 'Супер!'], ['Perfekt!', 'Идеально!'], ['Du er flink!', 'Ты молодец!']];
        const G_BAD = [['Nesten!', 'Почти!'], ['Prøv igjen!', 'Попробуй ещё!'], ['Ikke så farlig!', 'Не страшно!'], ['Neste gang!', 'В следующий раз!']];
        const G_NEED = { quiz: 4, pairs: 6, build: 5, blitz: 4 };
        const G_BEST = { quiz: v => v + ' из 10', pairs: v => 'ошибок: ' + v, build: v => v + ' из 8', blitz: v => v + ' верных' };

        const gmCls = t => t.length > 60 ? ' l2' : t.length > 28 ? ' l1' : '';   // длинный текст — мельче, чтобы кнопки не уезжали вниз
        const rnd = n => Math.random() * n | 0;
        const shuffled = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = rnd(k + 1);[a[k], a[j]] = [a[j], a[k]]; } return a; };
        const gPool = () => cards().filter(c => c.no && c.ru && (!cat || c.cat === cat) && (chap === '' || String(chOf(c)) === chap));
        const hap = ok => { try { if (ok) tg?.HapticFeedback?.impactOccurred('light'); else tg?.HapticFeedback?.notificationOccurred('error'); } catch (e) {} };
        const gmSvg = (pose, extra = '') => `<svg viewBox="30 0 140 165" aria-hidden="true">${mascot(pose)}${extra}</svg>`;
        const buildOk = c => { const t = c.no.trim().toLowerCase(), n = t.replace(/ /g, '').length; return /^[a-zæøå ]+$/.test(t) && t.split(' ').length <= 3 && n >= 3 && n <= 12; };

        function stopGame() { clearInterval(gTimer); if (G) clearTimeout(G.adv); G = null; }
        function gSay(ok, extra) {
            const sc = SCN[G.sc] || SCN.hello, base = ok ? G_OK : G_BAD, own = ok ? sc.ok : sc.bad, arr = own ? own.concat(base) : base;
            const p = arr[rnd(arr.length)];
            G.say = { pose: ok ? 'up' : 'down', b: p[0], s: extra || p[1] };
            G.anim = ok ? 'hop' : 'wob';
            hap(ok);
        }
        const gWrong = c => { S.st[c.id] = 'u'; save(); };   // ошибка в игре → слово попадает в «не знаю»

        function gShell(body, prog, scoreTxt, warn) {
            const s = G.say || { pose: 'wave', b: 'Hei! Lykke til!', s: 'Удачи!' };
            const an = G.swap ? 'swap' : (G.anim || ''); G.anim = ''; G.swap = false;
            return `
            <div class="gm-top">
                <button class="ib gm-x" aria-label="Выйти из игры" onclick="stopGame();render()">${ic('x')}</button>

            </div>
            <div class="gm-mas">${scnHtml(G.sc || 'hello', s.pose, an)}<div class="gm-say"><b>${esc(s.b)}</b><small>${esc(s.s)}</small></div></div>

        }

        const pickBtns = () => `
            <button class="pick" data-k="ch" onclick="openPick('ch')"><span class="pk-t"><span class="pk-l">Глава</span><span class="pk-v">${esc(chap === '' ? 'Все главы' : (+chap ? chap + ' · ' : '') + CHAPTERS[chap])}</span></span>${ic('chevron')}</button>
            <button class="pick" data-k="cat" onclick="openPick('cat')"><span class="pk-t"><span class="pk-l">Тема</span><span class="pk-v">${topicIc(cat)}${esc(cat || 'Все темы')}</span></span>${ic('chevron')}</button>`;

        function gamesMenuHtml() {
            const n = gPool().length;
            const pl = gPool(), sid = cat ? sceneFor({ cat }) : chap !== '' ? sceneOfPool(pl) : 'hello';
            return `
            <div class="gm-mas">${scnHtml(sid, 'wave', 'hop')}<div class="gm-say"><b>Hei! Давай играть!</b><small>Выбери игру. Слова берутся из выбранной ниже главы и темы, а ситуация с Кимом подстраивается под тему.</small></div></div>

            ${gmMsg ? `<div class="msg" style="margin:0 0 10px">${gmMsg}</div>` : ''}
            <div class="gm-grid">${GAMES.map(g => {
                const b = (S.gm || {})[g[0]];
                return `<button class="gm-tile" onclick="startGame('${g[0]}')"><span class="gm-ti">${ic(g[3])}</span><span class="gm-tt"><b>${g[1]}</b><small>${g[2]}</small>${b != null ? `<em>Рекорд: ${G_BEST[g[0]](b)}</em>` : ''}</span></button>`;
            }).join('')}</div>`;
        }

        function startGame(kind) {
            stopGame();
            const pool = gPool();
            const elig = kind === 'build' ? pool.filter(buildOk) : pool;
            if (elig.length < G_NEED[kind]) {
                gmMsg = kind === 'build'
                    ? 'Для этой игры нужно хотя бы 5 коротких слов без артиклей и скобок. Выберите другую главу или тему.'
                    : `Для этой игры нужно минимум ${G_NEED[kind]} слов. Выберите другую главу или тему.`;
                render(); return;
            }
            gmMsg = '';
            const g = G = { kind, score: 0, n: 0, pool, elig, say: { pose: 'wave', b: 'Hei! Lykke til!', s: 'Удачи!' }, anim: 'hop' };
            if (kind === 'quiz') { g.deck = shuffled(elig).slice(0, 10); g.total = g.deck.length; quizQ(); }
            else if (kind === 'pairs') {
                let src = elig.filter(c => c.no.length <= 24 && c.ru.length <= 28);
                if (src.length < 6) src = elig;
                const ch = shuffled(src).slice(0, 6);
                setScene(g, sceneOfPool(ch)); g.L = shuffled(ch); g.R = shuffled(ch); g.got = new Set(); g.sel = null; g.bad = null; g.lock = false; g.mis = 0; g.total = 6;
            }
            else if (kind === 'build') { g.deck = shuffled(elig).slice(0, 8); g.total = g.deck.length; buildQ(); }
            else { g.lives = 3; g.limit = 40000; g.t0 = Date.now(); g.last = ''; blitzQ(); gTimer = setInterval(blitzTick, 200); }
            render();
            window.scrollTo(0, 0);
        }

        function renderGame() { if (tab !== 'games' || !G) return; $('v').innerHTML = G.done ? gEnd() : gameHtml(); }
        function gameHtml() { return { quiz: quizHtml, pairs: pairsHtml, build: buildHtml, blitz: blitzHtml }[G.kind](); }

        function gFinish() {
            clearInterval(gTimer);
            const g = G; if (!g || g.done) return;
            clearTimeout(g.adv);
            g.done = true;
            let stars, title, detail, val;
            if (g.kind === 'pairs') { val = g.mis; stars = val <= 1 ? 3 : val <= 3 ? 2 : 1; title = val === 0 ? 'Ни одной ошибки!' : 'Все пары найдены!'; detail = 'Ошибок: ' + val; }
            else if (g.kind === 'blitz') { val = g.score; stars = val >= 15 ? 3 : val >= 8 ? 2 : val >= 3 ? 1 : 0; title = g.lives <= 0 ? 'Жизни закончились' : 'Время вышло!'; detail = 'Верных ответов: ' + val; }
            else { val = g.score; const r = val / g.total; stars = r >= .9 ? 3 : r >= .6 ? 2 : r >= .3 ? 1 : 0; title = ['Не страшно, повторим!', 'Хорошее начало!', 'Хороший результат!', 'Великолепно!'][stars]; detail = 'Верно: ' + val + ' из ' + g.total; }
            S.gm = S.gm || {};
            const old = S.gm[g.kind];
            if (old == null || (g.kind === 'pairs' ? val < old : val > old)) { S.gm[g.kind] = val; g.record = !(old == null && val === 0 && g.kind !== 'pairs'); }
            save();
            g.res = { stars, title, detail };
            g.anim = stars >= 2 ? 'hop' : 'wob';
            renderGame();
            if (stars >= 2) { burst(innerWidth / 2, innerHeight / 3, 14 + stars * 8); try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (e) {} }
        }
        function gEnd() {
            const g = G, r = g.res, an = g.anim || ''; g.anim = '';
