<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#1e7fd8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Настройки (меняются из JS) */
            --c-r: 255; --c-g: 255; --c-b: 255;
            --a1: .26; --a2: .07; --a3: .14;   /* прозрачность «стекла» */
            --bg-img: none;
            --bg-color: #1e7fd8;
            --tint: 0;                          /* насколько цвет фона проступает поверх фото */

            --tx: #fff;
            --mut: rgba(255, 255, 255, .72);
            --ctx: #fff;                        /* цвет текста на карточках */
            --cmut: rgba(255, 255, 255, .72);
            --ac: #ff6b81;
            --ok: #4cd9a0;
            --no: #ffb04d;

            --bd: rgba(var(--c-r), var(--c-g), var(--c-b), .35);
            --glass: linear-gradient(135deg, rgba(var(--c-r), var(--c-g), var(--c-b), var(--a1)), rgba(var(--c-r), var(--c-g), var(--c-b), var(--a2)) 55%, rgba(var(--c-r), var(--c-g), var(--c-b), var(--a3)));
            --blur: blur(22px) saturate(180%);
            --edge: inset 0 1px 1px rgba(255, 255, 255, .6), inset 0 -1px 1px rgba(255, 255, 255, .12), inset 0 0 18px rgba(var(--c-r), var(--c-g), var(--c-b), .1), 0 10px 30px rgba(0, 30, 90, .28);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; padding: 0; }

        /* Карточка при вылете уходит за экран — не даём странице ехать вбок вместе с фоном */
        html, body {
            overflow-x: hidden;
            overflow-x: clip;
            max-width: 100%;
            overscroll-behavior-x: none;
        }
        body { touch-action: pan-y pinch-zoom; }

        body {
            color: var(--tx);
            font: 16px/1.4 system-ui, -apple-system, "SF Pro Display", Segoe UI, Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            text-shadow: 0 1px 8px rgba(0, 30, 90, .35);
            -webkit-text-size-adjust: 100%;
        }

        /* Фон отдельным фиксированным слоем: background-attachment:fixed глючит на iOS */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--bg-img) center / cover no-repeat;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg-color);
            opacity: var(--tint);
            pointer-events: none;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 { font-size: 24px; margin: 4px 2px 0; font-weight: 700; }

        /* Нижняя навигация — под большой палец */
        nav {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            width: calc(100% - 24px);
            max-width: 536px;
            z-index: 10;
            display: flex;
            gap: 4px;
            padding: 6px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--bd);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--edge);
            transition: transform .2s ease, opacity .2s ease;
        }
        /* Прячем меню, когда открыта клавиатура */
        body.typing nav { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }

        button, select, input { font: inherit; color: var(--ctx); text-shadow: inherit; margin: 0; }

        nav button {
            flex: 1;
            min-height: 48px;
            padding: 0 6px;
            font-size: 15px;
            font-weight: 600;
            border: 0;
            background: transparent;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s ease;
            white-space: nowrap;
        }
        nav button#t-settings { flex: 0 0 56px; font-size: 18px; }
        nav button.on { background: rgba(255, 255, 255, .3); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 2px 10px rgba(0, 30, 90, .25); }

        .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }

        select, input, textarea, .ib, .sm {
            background: var(--glass);
            border: 1px solid var(--bd);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--edge);
        }

        select, input[type="text"], input:not([type]), textarea {
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 16px;      /* 16px — чтобы iOS не зумил страницу при фокусе */
            width: 100%;
            min-width: 0;
            outline: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        select option { color: #123; }
        input::placeholder { color: var(--cmut); }
        input:focus, select:focus { border-color: rgba(255, 255, 255, .8); }

        .row select { flex: 1 1 100%; }
        @media (min-width: 400px) { .row select { flex: 1; } }

        .ib {
            min-height: 52px;
            padding: 0 18px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats { display: flex; gap: 6px 12px; font-size: 14px; color: var(--mut); margin: 2px 2px 8px; flex-wrap: wrap; justify-content: center; text-align: center; }
        .stats b { color: var(--tx); }

        .card {
            position: relative;
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--bd);
            border-radius: 32px;
            min-height: 300px;
            min-height: min(52dvh, 420px);
            padding: 40px 20px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            color: var(--ctx);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--edge);
            transition: transform .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }
        .card { transform-origin: 50% 100%; will-change: transform; }
        .card:active { transform: scale(.97); }
        .card.drag { transition: none; }
        .card.enter { animation: cardIn .28s ease-out; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: none; } }
        /* Затемнение с цветом стороны, проступает по мере смещения карточки */
        .card > .shade {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(rgba(0, 20, 50, .3), rgba(0, 20, 50, .3)), var(--sc, transparent);
        }
        .card > .stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            translate: -50% -50%;
            opacity: 0;
            pointer-events: none;
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            padding: 8px 18px;
            border: 3px solid #fff;
            border-radius: 16px;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 30, 90, .45);
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 60% at 15% 0, rgba(255, 255, 255, .35), transparent 55%);
            pointer-events: none;
        }
        .card > * { position: relative; }
        .card .cat { position: absolute; top: 18px; left: 22px; font-size: 13px; color: var(--cmut); font-weight: 500; }
        .card .big { font-size: 32px; font-weight: 700; overflow-wrap: anywhere; line-height: 1.2; }
        .card .ans { font-size: 24px; margin-top: 12px; color: var(--ctx); opacity: .92; overflow-wrap: anywhere; }
        .card .ex { margin-top: 18px; color: var(--cmut); font-style: italic; font-size: 18px; }
        .card .hint { position: absolute; bottom: 16px; font-size: 14px; color: var(--cmut); opacity: .85; }

        .act { display: flex; gap: 12px; margin-top: 4px; }
        .act button {
            flex: 1;
            min-height: 60px;
            padding: 0 12px;
            border-radius: 24px;
            color: #fff;
            font-size: 17px;
            font-weight: 650;
            cursor: pointer;
            border: 1px solid var(--bd);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--edge);
            transition: transform .1s;
        }
        .act button:active { transform: scale(.95); }
        .bn { background: linear-gradient(135deg, rgba(255, 176, 77, .65), rgba(255, 176, 77, .25)); }
        .bk { background: linear-gradient(135deg, rgba(76, 217, 160, .65), rgba(76, 217, 160, .25)); }
        .swipe-tip { text-align: center; font-size: 13px; color: var(--mut); margin-top: 2px; }

        .empty { text-align: center; color: var(--mut); padding: 48px 20px; font-size: 18px; line-height: 1.5; }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 12px 12px 16px;
            margin-bottom: 10px;
            border-radius: 20px;
            color: var(--ctx);
            background: var(--glass);
            border: 1px solid var(--bd);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--edge);
        }
        .item .t { flex: 1; min-width: 0; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
        .item .t small { display: block; color: var(--cmut); font-size: 14px; margin-top: 2px; font-weight: 400; }

        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, .35); flex: none; margin-right: 4px; }
        .dot.k { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
        .dot.u { background: var(--no); box-shadow: 0 0 10px var(--no); }

        .sm {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            padding: 0;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        label { display: block; font-size: 14px; color: var(--mut); margin: 14px 4px 6px; font-weight: 500; }

        .pri {
            margin-top: 20px;
            width: 100%;
            min-height: 56px;
            padding: 0 18px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, .4), rgba(255, 255, 255, .12));
            color: #fff;
            font-size: 17px;
            font-weight: 650;
            cursor: pointer;
            border: 1px solid var(--bd);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--edge);
            transition: transform .1s;
        }
        .pri:active { transform: scale(.97); }
        .pri.ghost { background: transparent; box-shadow: none; margin-top: 10px; }
        .pri.sec { margin-top: 10px; background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.06)); }

        .msg { color: #d6ffee; margin-top: 14px; min-height: 20px; text-align: center; font-weight: 500; }

        /* ---------- Настройки ---------- */
        .panel {
            padding: 4px 16px 16px;
            margin-bottom: 12px;
            border-radius: 24px;
            color: var(--ctx);
            background: var(--glass);
            border: 1px solid var(--bd);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            box-shadow: var(--edge);
        }
        .panel label { color: var(--cmut); margin-left: 0; }

        .swatches { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .sw {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .55);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 30, 90, .3);
            background-clip: padding-box;
            flex: none;
        }
        .sw.on { outline: 3px solid #fff; outline-offset: 2px; }
        .sw.none { background: linear-gradient(135deg, #fff 46%, #f33 46%, #f33 54%, #fff 54%); }

        /* Круглый выбор своего цвета (раньше appearance:none делал его невидимым на телефонах) */
        .sw-custom {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .55);
            background: conic-gradient(#f66, #fd5, #6e8, #5cf, #a6f, #f66);
            overflow: hidden;
            flex: none;
        }
        .sw-custom input[type="color"] {
            position: absolute;
            inset: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 20px);
            opacity: 0;
            cursor: pointer;
            border: 0;
            padding: 0;
        }

        .file-btn { position: relative; display: block; margin-top: 4px; }
        .file-btn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
        .file-btn .pri { margin-top: 0; pointer-events: none; }

        .bg-preview {
            height: 120px;
            border-radius: 18px;
            margin-top: 12px;
            border: 1px solid var(--bd);
            background: center / cover no-repeat;
        }

        @media (max-width: 380px) {
            .card .big { font-size: 28px; }
            nav button { font-size: 14px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>

skal, må, vil, kan, bør|модальные глаголы: инфинитив БЕЗ «å»|Грамматика|Jeg må gjøre lekser.
Рефлексив: jeg–meg, du–deg, han/hun–seg, vi–oss, dere–dere, de–seg|возвратные местоимения|Грамматика|Han koser seg. De koser seg.
Han vasker seg. / Han vasker ham.|умывает себя / умывает его (другого)|Грамматика|«seg» — если подлежащее и дополнение один человек.
og / men|«и» соединяет, «но» — контраст|Грамматика|Jeg jobber ikke nå, men jeg ønsker å finne en jobb.
Существительные на -er (en lærer)|мн.ч.: lærere, определённая: læreren / lærerne|Грамматика|en samboer – samboeren – samboere – samboerne
Произношение: æi|ei и eg часто читаются как «æi»|Грамматика|hei, nei, jeg, seg, meg, pleier`;

        const hid = s => { let h = 5381; for (const ch of s) h = (h * 33 ^ ch.charCodeAt(0)) >>> 0; return 'b' + h.toString(36) };
        const BASE = RAW.trim().split('\n').map((l, i) => { const p = l.split('|'); return { id: hid(p[0] + '|' + p[1]), old: 'b' + i, no: p[0], ru: p[1], cat: p[2], ex: p[3] || '' } });

        /* Telegram Web App */
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const userId = tg?.initDataUnsafe?.user?.id || 'guest';
        const STORAGE_KEY = 'nk_data_' + userId;
        const BG_KEY = 'nk_bg_' + userId;   // фото хранится отдельно, чтобы не мешать сохранению прогресса

        let S;
        try { S = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') } catch (e) {}
        S = S || { st: {}, cu: [], dir: 0, bgColor: '', cardColor: '' };

        const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)) } catch (e) {} };
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const $ = id => document.getElementById(id);

        if (!S.v) {
            BASE.forEach(c => { if (S.st[c.old]) { S.st[c.id] = S.st[c.old]; delete S.st[c.old] } });
            S.v = 2;
        }

        let BG = '';
        try { BG = localStorage.getItem(BG_KEY) || '' } catch (e) {}
        // Миграция: раньше фото лежало внутри основных данных, ссылки больше не поддерживаются
        if (S.bgUrl !== undefined) {
            if (S.bgUrl.startsWith('data:') && !BG) {
                try { localStorage.setItem(BG_KEY, S.bgUrl); BG = S.bgUrl } catch (e) {}
            }
            delete S.bgUrl;
            save();
        }

        const cards = () => BASE.concat(S.cu);
        const cats = () => [...new Set(cards().map(c => c.cat))];

        /* ---------- Тема ---------- */
        function applyTheme() {
            const root = document.documentElement.style;
            root.setProperty('--bg-img', BG ? `url("${BG}")` : `url('bg.jpg')`);
            root.setProperty('--tint', BG ? '.35' : '0');
            const bgc = S.bgColor || '#1e7fd8';
            root.setProperty('--bg-color', bgc);
            const tc = document.querySelector('meta[name="theme-color"]');
            if (tc) tc.content = bgc;

            const hex = /^#[0-9a-f]{6}$/i.test(S.cardColor || '') ? S.cardColor : '';
            if (hex) {
                const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                root.setProperty('--c-r', r); root.setProperty('--c-g', g); root.setProperty('--c-b', b);
                // Выбранный цвет делаем заметным: плотнее стекло
                root.setProperty('--a1', '.62'); root.setProperty('--a2', '.34'); root.setProperty('--a3', '.48');
                // Светлый цвет карточки — тёмный текст, иначе не прочитать
                const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                if (lum > 0.62) {
                    root.setProperty('--ctx', '#10243a');
                    root.setProperty('--cmut', 'rgba(16,36,58,.68)');
                } else {
                    root.setProperty('--ctx', '#fff');
                    root.setProperty('--cmut', 'rgba(255,255,255,.75)');
                }
            } else {
                root.setProperty('--c-r', 255); root.setProperty('--c-g', 255); root.setProperty('--c-b', 255);
                root.setProperty('--a1', '.26'); root.setProperty('--a2', '.07'); root.setProperty('--a3', '.14');
                root.setProperty('--ctx', '#fff');
                root.setProperty('--cmut', 'rgba(255,255,255,.72)');
            }
        }
        applyTheme();

        const setCard = v => { S.cardColor = v; save(); applyTheme(); render(); };
        const setBgColor = v => { S.bgColor = v; save(); applyTheme(); render(); };
        function rmBg() {
            BG = '';
            try { localStorage.removeItem(BG_KEY) } catch (e) {}
            bgMsg = '';
            applyTheme(); render();
        }
        function resetAll() { S.cardColor = ''; S.bgColor = ''; save(); rmBg(); }

        /* Загрузка фото с устройства */
        window.uploadBg = function (e) {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            const fail = () => { bgMsg = '⚠️ Не получилось загрузить это фото. Попробуйте другое.'; render(); };
            const reader = new FileReader();
            reader.onerror = fail;
            reader.onload = ev => {
                const img = new Image();
                img.onerror = fail;
                img.onload = () => {
                    const MAX = 1280;
                    let w = img.width, h = img.height;
                    if (w > MAX || h > MAX) {
                        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
                        else { w = Math.round(w * MAX / h); h = MAX; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    try {
                        const data = canvas.toDataURL('image/jpeg', 0.75);
                        localStorage.setItem(BG_KEY, data);
                        BG = data;
                        bgMsg = '✓ Фон обновлён';
                        applyTheme();
                        render();
                    } catch (err) {
                        fail();
                    }
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        /* ---------- Состояние ---------- */
        let tab = 'study', deck = [], i = 0, flip = false, cat = '', mode = 'todo', q = '', msg = '', bgMsg = '', rst = false, enter = false;

        function build() {
            deck = cards().filter(x => (!cat || x.cat === cat) && (mode === 'all' || (mode === 'new' && !S.st[x.id]) || (mode === 'todo' && S.st[x.id] !== 'k') || (mode === 'known' && S.st[x.id] === 'k')));
            i = 0;
            flip = false;
        }

        function go(t) {
            tab = t; msg = ''; bgMsg = ''; rst = false;
            if (t === 'study') build();
            render();
            window.scrollTo(0, 0);
        }

        function shuf() {
            for (let k = deck.length - 1; k > 0; k--) {
                const j = Math.random() * (k + 1) | 0;
                [deck[k], deck[j]] = [deck[j], deck[k]];
            }
            i = 0; flip = false; render();
        }

        function mark(v) {
            if (i >= deck.length) return;
            S.st[deck[i].id] = v;
            save();
            i++; flip = false; enter = true; render();
        }

        function cnt() {
            let k = 0, u = 0;
            const a = cards();
            a.forEach(c => { if (S.st[c.id] === 'k') k++; else if (S.st[c.id] === 'u') u++; });
            return { k, u, n: a.length - k - u, t: a.length };
        }

        const statsHtml = () => { const n = cnt(); return `<span>✅ знаю <b>${n.k}</b></span><span>🟠 не знаю <b>${n.u}</b></span><span>⚪ новые <b>${n.n}</b></span><span>всего <b>${n.t}</b></span>`; };

        /* Список обновляем точечно, чтобы не сбрасывать клавиатуру и прокрутку */
        function listHtml() {
            const all = cards().filter(c => !q || (c.no + c.ru).toLowerCase().includes(q.toLowerCase()));
            return all.map(c => `
                <div class="item">
                    <span class="dot ${S.st[c.id] || ''}"></span>
                    <div class="t">${esc(c.no)}<small>${esc(c.ru)}</small></div>
                    <button class="sm" aria-label="Знаю" onclick="setSt('${c.id}','k')">✓</button>
                    <button class="sm" aria-label="Не знаю" onclick="setSt('${c.id}','u')">✗</button>
                    ${c.id[0] === 'c' ? `<button class="sm" aria-label="Удалить" onclick="delCard('${c.id}')">🗑</button>` : ''}
                </div>`).join('') || '<div class="empty">Ничего не найдено</div>';
        }
        function refreshList() { $('lst').innerHTML = listHtml(); $('stl').innerHTML = statsHtml(); }
        function setSt(id, v) { S.st[id] = v; save(); refreshList(); }
        function delCard(id) { S.cu = S.cu.filter(x => x.id !== id); delete S.st[id]; save(); refreshList(); }

        /* ---------- Рендер ---------- */
        const swatches = (list, isOn, fn) => list.map(c => `<button class="sw ${isOn(c) ? 'on' : ''}" style="background:${c}" aria-label="${c}" onclick="${fn}('${c}')"></button>`).join('');
        const CARD_COLORS = ['#ff6b81', '#ffb04d', '#4cd9a0', '#5cb8ff', '#a78bfa', '#ffffff', '#1b2a41'];
        const BG_COLORS = ['#1e7fd8', '#0f766e', '#7c3aed', '#be185d', '#b45309', '#111827'];

        function render() {
            ['study', 'list', 'add', 'settings'].forEach(t => { const el = $('t-' + t); if (el) el.className = t === tab ? 'on' : ''; });

            let h = '';

            if (tab === 'study') {
                h += `
                <div class="row">
                    <select onchange="cat=this.value;build();render()">
                        <option value="">Все темы</option>
                        ${cats().map(c => `<option ${c === cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}
                    </select>
                    <select onchange="mode=this.value;build();render()">
                        ${[['todo', 'Не знаю + новые'], ['new', 'Только новые'], ['all', 'Все'], ['known', 'Знаю']].map(m => `<option value="${m[0]}" ${m[0] === mode ? 'selected' : ''}>${m[1]}</option>`).join('')}
                    </select>
                    <div style="display:flex; gap:10px; width:100%;">
                        <button class="ib" style="flex:1;" title="Перемешать" aria-label="Перемешать" onclick="shuf()">🔀</button>
                        <button class="ib" style="flex:1;" title="Сменить направление" aria-label="Сменить направление" onclick="S.dir^=1;save();render()">⇄</button>
                    </div>
                </div>
                <div class="stats">${statsHtml()}</div>`;

                if (!deck.length) {
                    h += `<div class="empty">В этой подборке нет карточек 🎉<br>Смените фильтр или добавьте новые.</div>`;
                } else if (i >= deck.length) {
                    h += `<div class="empty">Колода пройдена! 🎉<br><br><button class="pri" onclick="build();render()">Ещё раз (по текущему фильтру)</button></div>`;
                } else {
                    const c = deck[i], f = S.dir ? c.ru : c.no, b = S.dir ? c.no : c.ru;
                    h += `
                    <div class="stats"><span>Карточка ${i + 1} / ${deck.length}</span></div>
                    <div class="card ${enter ? 'enter' : ''}" onclick="tap()">
                        <span class="cat">${esc(c.cat)}</span>
                        <div class="big">${esc(f)}</div>
                        ${flip ? `
                            <div class="ans">${esc(b)}</div>
                            ${c.ex ? `<div class="ex">${esc(c.ex)}</div>` : ''}
                        ` : `<div class="hint">нажмите, чтобы перевернуть</div>`}
                        <div class="shade"></div>
                        <div class="stamp"></div>
                    </div>
                    <div class="act">
                        <button class="bn" onclick="fly('u')">Не знаю</button>
                        <button class="bk" onclick="fly('k')">Знаю</button>
                    </div>
                    <div class="swipe-tip">← свайп: не знаю · знаю: свайп →</div>`;
                }
            } else if (tab === 'list') {
                h += `
                <div class="stats" id="stl">${statsHtml()}</div>
                <div class="row" style="flex-wrap:nowrap;">
                    <input id="q" placeholder="Поиск…" value="${esc(q)}" enterkeyhint="search" oninput="q=this.value;refreshList()">
                    <button class="ib" onclick="if(rst){S.st={};save();rst=false}else rst=true;render()">${rst ? 'Точно?' : 'Сброс'}</button>
                </div>
                <div id="lst">${listHtml()}</div>`;
            } else if (tab === 'add') {
                h += `
                <label>По-норвежски</label>
                <input id="a-no" autocomplete="off" autocapitalize="none" enterkeyhint="next">
                <label>Перевод</label>
                <input id="a-ru" autocomplete="off" enterkeyhint="next">
                <label>Тема</label>
                <input id="a-cat" list="cl" value="Мои слова" autocomplete="off" enterkeyhint="next">
                <datalist id="cl">${cats().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
                <label>Пример (необязательно)</label>
                <input id="a-ex" autocomplete="off" enterkeyhint="done" onkeydown="if(event.key==='Enter')add()">
                <button class="pri" onclick="add()">Добавить карточку</button>
                <div class="msg">${msg}</div>`;
            } else if (tab === 'settings') {
                const cc = (S.cardColor || '').toLowerCase(), bc = (S.bgColor || '#1e7fd8').toLowerCase();
                h += `
                <div class="stats" style="font-size:16px;"><span><b>Внешний вид</b></span></div>

                <div class="panel">
                    <label>🎨 Цвет карточек</label>
                    <div class="swatches">
                        <button class="sw ${!cc ? 'on' : ''}" style="background:rgba(255,255,255,.35)" aria-label="Стандартный" onclick="setCard('')"></button>
                        ${swatches(CARD_COLORS, c => c === cc, 'setCard')}
                        <div class="sw-custom" title="Свой цвет">
                            <input type="color" value="${S.cardColor || '#ffffff'}" aria-label="Свой цвет карточек"
                                oninput="S.cardColor=this.value;applyTheme()" onchange="save();render()">
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <label>🖌 Цвет фона</label>
                    <div class="swatches">
                        ${swatches(BG_COLORS, c => c === bc, 'setBgColor')}
                        <div class="sw-custom" title="Свой цвет">
                            <input type="color" value="${S.bgColor || '#1e7fd8'}" aria-label="Свой цвет фона"
                                oninput="S.bgColor=this.value;applyTheme()" onchange="save();render()">
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <label>🖼 Фото на фон</label>
                    ${BG ? `<div class="bg-preview" style="background-image:url('${BG}')"></div>` : ''}
                    <div class="file-btn" style="margin-top:12px;">
                        <div class="pri" style="display:flex;align-items:center;justify-content:center;">📸 ${BG ? 'Выбрать другое фото' : 'Выбрать фото'}</div>
                        <input type="file" accept="image/*" onchange="uploadBg(event)" aria-label="Выбрать фото для фона">
                    </div>
                    ${BG ? `<button class="pri sec" onclick="rmBg()">Убрать фото</button>` : ''}
                    <div class="msg">${bgMsg}</div>
                </div>

                <button class="pri ghost" onclick="resetAll()">Сбросить оформление</button>`;
            }

            enter = false;
            $('v').innerHTML = h;
        }

        function tap() { if (swiped || busy) return; flip = !flip; render(); }

        function add() {
            const no = $('a-no').value.trim(), ru = $('a-ru').value.trim();
            if (!no || !ru) { msg = 'Заполните оба поля'; render(); return; }
            S.cu.push({ id: 'c' + Date.now(), no, ru, cat: $('a-cat').value.trim() || 'Мои слова', ex: $('a-ex').value.trim() });
            save();
            msg = '✓ Добавлено! Всего карточек: ' + cards().length;
            render();
            $('a-no').focus();
        }

        /* Свайп: карточка едет за пальцем, темнеет и подсвечивается; вправо — «знаю», влево — «не знаю» */
        let tx = 0, ty = 0, tcard = null, drag = false, swiped = false, busy = false;
        const TH = () => Math.min(120, window.innerWidth * 0.28);

        function paint(card, dx) {
            const sh = card.querySelector('.shade'), st = card.querySelector('.stamp');
            card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg) scale(1.02)`;
            sh.style.setProperty('--sc', dx > 0 ? 'rgba(76,217,160,.8)' : 'rgba(255,176,77,.8)');
            sh.style.opacity = Math.min(Math.abs(dx) / (TH() * 1.4), 1) * .9;
            st.textContent = dx > 0 ? 'Знаю ✓' : 'Не знаю ✗';
            st.style.opacity = Math.max(0, Math.min((Math.abs(dx) - 20) / TH(), 1));
        }
        function unpaint(card) {
            card.style.transform = '';
            card.querySelector('.shade').style.opacity = 0;
            card.querySelector('.stamp').style.opacity = 0;
        }
        function fling(card, v) {
            busy = true;
            const dir = v === 'k' ? 1 : -1;
            card.classList.remove('drag');
            card.style.transition = 'transform .28s ease-in, opacity .28s ease-in';
            card.style.transform = `translateX(${dir * (window.innerWidth + 200)}px) rotate(${dir * 24}deg)`;
            card.style.opacity = 0;
            setTimeout(() => { busy = false; mark(v); }, 260);
        }
        // Кнопки «Знаю / Не знаю» — та же анимация
        function fly(v) {
            const c = document.querySelector('.card');
            if (!c || busy) { mark(v); return; }
            paint(c, v === 'k' ? 50 : -50);
            fling(c, v);
        }

        $('v').addEventListener('touchstart', e => {
            if (busy) return;
            const c = e.target.closest('.card');
            tcard = tab === 'study' ? c : null;
            drag = false;
            if (tcard) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
        }, { passive: true });
        $('v').addEventListener('touchmove', e => {
            if (!tcard || busy) return;
            const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
            if (!drag && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { drag = true; tcard.classList.add('drag'); }
            if (drag) paint(tcard, dx);
        }, { passive: true });
        const endTouch = e => {
            const c = tcard;
            tcard = null;
            if (!c || !drag) return;
            drag = false;
            swiped = true;
            setTimeout(() => swiped = false, 400);
            const dx = e.changedTouches[0].clientX - tx;
            if (e.type === 'touchend' && Math.abs(dx) >= TH()) fling(c, dx > 0 ? 'k' : 'u');
            else { c.classList.remove('drag'); unpaint(c); }
        };
        $('v').addEventListener('touchend', endTouch);
        $('v').addEventListener('touchcancel', endTouch);

        /* Прячем нижнее меню, пока открыта клавиатура */
        const isText = el => el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !/^(color|file)$/.test(el.type);
        document.addEventListener('focusin', e => { if (isText(e.target)) document.body.classList.add('typing'); });
        document.addEventListener('focusout', () => setTimeout(() => { if (!isText(document.activeElement)) document.body.classList.remove('typing'); }, 120));

        document.addEventListener('keydown', e => {
            if (tab !== 'study' || /INPUT|SELECT/.test(e.target.tagName)) return;
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip = !flip; render(); }
            else if (e.key === 'ArrowLeft') mark('u');
            else if (e.key === 'ArrowRight') mark('k');
        });

        build();
        render();
    </script>
</body>
</html>
