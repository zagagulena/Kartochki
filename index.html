<html lang="ru"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}html,body{margin:0}
body{color:var(--tx);font:16px/1.4 system-ui,-apple-system,"SF Pro Display",Segoe UI,Roboto,sans-serif;min-height:100vh;

button,select,input{font:inherit;color:var(--tx);text-shadow:inherit}
nav button{flex:1;padding:9px;border:0;background:transparent;border-radius:999px;cursor:pointer;transition:.25s}

.row{display:flex;gap:6px;margin-bottom:10px}
select,input,textarea,.ib,.sm{background:var(--glass);border:1px solid var(--bd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--edge)}
select,input,textarea{padding:10px 12px;border-radius:14px;width:100%;min-width:0;outline:0}
select option{color:#123}
input::placeholder{color:var(--mut)}input:focus,select:focus{border-color:rgba(255,255,255,.7)}
.ib{width:auto;padding:9px 12px;border-radius:14px;cursor:pointer}
.stats{display:flex;gap:12px;font-size:13px;color:var(--mut);margin:4px 2px 10px;flex-wrap:wrap}.stats b{color:var(--tx)}
.card{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--bd);border-radius:28px;min-height:260px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--edge);transition:transform .2s}
.card:active{transform:scale(.98)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 15% 0,rgba(255,255,255,.35),transparent 55%);pointer-events:none}
.card>*{position:relative}
.card .cat{position:absolute;top:14px;left:18px;font-size:12px;color:var(--mut)}
.card .big{font-size:29px;font-weight:700;overflow-wrap:anywhere}
.card .ans{font-size:22px;margin-top:8px}
.card .ex{margin-top:14px;color:var(--mut);font-style:italic}
.card .hint{position:absolute;bottom:12px;font-size:12px;color:var(--mut)}
.spk{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;cursor:pointer}
.act{display:flex;gap:10px;margin-top:12px}
.act button{flex:1;padding:15px;border-radius:20px;color:#fff;font-weight:650;cursor:pointer;border:1px solid var(--bd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--edge)}
.bn{background:linear-gradient(135deg,rgba(255,176,77,.65),rgba(255,176,77,.25))}
.bk{background:linear-gradient(135deg,rgba(76,217,160,.65),rgba(76,217,160,.25))}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
.item{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px;border-radius:18px;background:var(--glass);border:1px solid var(--bd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--edge)}
.item .t{flex:1;min-width:0}.item .t small{display:block;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);flex:none}
.dot.k{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.u{background:var(--no);box-shadow:0 0 8px var(--no)}
.sm{border-radius:10px;padding:4px 9px;cursor:pointer;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 2px 4px}
.pri{margin-top:16px;width:100%;padding:14px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.12));color:#fff;font-weight:650;cursor:pointer;border:1px solid var(--bd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--edge)}
.on2{background:rgba(255,255,255,.45)!important}
.msg{color:#d6ffee;margin-top:10px;min-height:20px}
</style></head><body><main>

<script>
const RAW=`stå opp|вставать|Глаголы|Jeg står opp klokka sju.

servere|подавать (еду)|Глаголы|Jeg liker å servere god mat.

et døgn|сутки (24 часа)|Время|Et døgn = 24 timer.
først – så – etterpå – til slutt|сначала – потом – после – в конце|Время|Først dusjer jeg. Så kler jeg på meg.
tidlig|рано|Время|Jeg står opp tidlig.
etterpå|потом, после этого|Время|Etterpå spiser vi frokost.
til slutt|в конце, наконец|Время|Til slutt pusser han tennene.
en frokost|завтрак|Еда и кафе|Klokka sju spiser han frokost.
en lunsj|обед (около 12:00)|Еда и кафе|Klokka tolv spiser han lunsj.
en middag|ужин, основной приём пищи|Еда и кафе|Jeg spiser middag klokka fem.
en kveldsmat|поздний ужин|Еда и кафе|Klokka ni spiser han kveldsmat.
ei/en matpakke|завтрак с собой|Еда и кафе|
ei/en fiskesuppe|рыбный суп|Еда и кафе|Vi har ei nydelig fiskesuppe.
ei/en tomatsuppe|томатный суп|Еда и кафе|Jeg har lyst på tomatsuppe.
ei/en mugge|кувшин|Еда и кафе|Jeg kan hente ei mugge med vann.
en kopp kaffe|чашка кофе|Еда и кафе|Jeg vil ha en kopp kaffe.

en cola|кола|Еда и кафе|Et glass cola.
ei/en sjokoladekake|шоколадный торт|Еда и кафе|
en hamburger|гамбургер|Еда и кафе|Jeg tar en hamburger.
en meny|меню|Еда и кафе|De leser menyen.
en servitør|официант (= en kelner)|Еда и кафе|Servitøren kommer.
en kokk|повар|Еда и кафе|En kokk lager maten.
en gjest|гость, клиент|Еда и кафе|Gjestene bestiller mat.
en restaurant|ресторан|Еда и кафе|Jeg jobber på en restaurant.
et kjøkken|кухня|Еда и кафе|Jeg leverer bestillingen til kjøkkenet.
god mat|вкусная еда|Еда и кафе|
sulten|голодный|Еда и кафе|Jeg er veldig sulten.
tørst|жаждущий|Еда и кафе|Jeg er så tørst.
nydelig|прекрасный, очень вкусный|Еда и кафе|
ha lyst på|хотеть (что-то конкретное)|Еда и кафе|Hva har du lyst på?
være glad i|любить|Еда и кафе|Jeg er ikke så glad i fisk.
uten|без|Еда и кафе|Kaffe uten melk.
ledig|свободный|Еда и кафе|Har du et ledig bord?

Lenge siden sist!|Давно не виделись!|Общение|
Så hyggelig å høre.|Приятно слышать.|Общение|
Jeg må skynde meg.|Мне надо спешить.|Общение|
Vi snakkes.|Ещё поговорим / Созвонимся.|Общение|Vi snakkes til helga.
Jeg gleder meg.|Я жду этого с нетерпением.|Общение|
Ha det bra! / Ha det!|Всего доброго! / Пока!|Общение|
Det er travelt.|Много дел, суматоха.|Общение|
ha mye å gjøre|иметь много дел|Общение|Jeg har mye å gjøre.
ha dårlig tid|мало времени|Общение|Jeg har dårlig tid.
ha god tid|иметь достаточно времени|Общение|Jeg liker å ha god tid om morgenen.
ta en kaffe|выпить кофе (вместе)|Общение|Skal vi ta en kaffe til helga?
ei/en helg|выходные|Общение|
i helga / til helga|в выходные / к выходным|Общение|
av og til|иногда (= noen ganger)|Общение|Av og til spiser jeg frokost på kafé.
ofte|часто|Общение|
slitsomt|утомительно, хлопотно|Общение|Det er slitsomt å være lærer.
aktiv|активный|Общение|Så aktiv du er!
trøtt|уставший, хочется спать|Общение|Jeg er trøtt om kvelden.
annenhver uke|каждую вторую неделю|Общение|Jeg har barna annenhver uke.
hos|у (в гостях, дома у)|Общение|Hjemme hos Bjørnar.
folk|люди|Общение|Det er mye folk.
en nyhet / se på nyheter|новость / смотреть новости|Общение|Han ser på nyheter.
en fjelltur / gå på fjelltur|поход в горы / идти в поход|Общение|Noen ganger går jeg på fjelltur.
en skog|лес|Общение|Jeg jogger i skogen.
en mage|живот|Общение|
pleier å + inf.|обычно (делаю), имею привычку|Грамматика|Når pleier du å stå opp? – Jeg pleier å stå opp klokka sju.
liker å, elsker å, ønsker å, begynner å, slutter å, prøver å|инфинитив С «å» после этих глаголов|Грамматика|Jeg liker å lese.
skal, må, vil, kan, bør|модальные глаголы: инфинитив БЕЗ «å»|Грамматика|Jeg må gjøre lekser.
Рефлексив: jeg–meg, du–deg, han/hun–seg, vi–oss, dere–dere, de–seg|возвратные местоимения|Грамматика|Han koser seg. De koser seg.
Han vasker seg. / Han vasker ham.|умывает себя / умывает его (другого)|Грамматика|«seg» — если подлежащее и дополнение один человек.
og / men|«и» соединяет, «но» — контраст|Грамматика|Jeg jobber ikke nå, men jeg ønsker å finne en jobb.
Существительные на -er (en lærer)|мн.ч.: lærere, определённая: læreren / lærerne|Грамматика|en samboer – samboeren – samboere – samboerne
Произношение: æi|ei и eg часто читаются как «æi»|Грамматика|hei, nei, jeg, seg, meg, pleier`;
const hid=s=>{let h=5381;for(const ch of s)h=(h*33^ch.charCodeAt(0))>>>0;return 'b'+h.toString(36)};
const BASE=RAW.trim().split('\n').map((l,i)=>{const p=l.split('|');return{id:hid(p[0]+'|'+p[1]),old:'b'+i,no:p[0],ru:p[1],cat:p[2],ex:p[3]||''}});
let S;try{S=JSON.parse(localStorage.getItem('nk')||'null')}catch(e){}
S=S||{st:{},cu:[],dir:0};
if(!S.v){BASE.forEach(c=>{if(S.st[c.old]){S.st[c.id]=S.st[c.old];delete S.st[c.old]}});S.v=2}

const save=()=>{try{localStorage.setItem('nk',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cards=()=>BASE.concat(S.cu);
const cats=()=>[...new Set(cards().map(c=>c.cat))];
let tab='study',deck=[],i=0,flip=false,cat='',mode='todo',q='',msg='',rst=false;
function build(){deck=cards().filter(x=>(!cat||x.cat===cat)&&(mode==='all'||(mode==='new'&&!S.st[x.id])||(mode==='todo'&&S.st[x.id]!=='k')||(mode==='known'&&S.st[x.id]==='k')));i=0;flip=false}
function go(t){tab=t;msg='';if(t==='study')build();render()}
function shuf(){for(let k=deck.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[deck[k],deck[j]]=[deck[j],deck[k]]}i=0;flip=false;render()}
let VO=null,lastK='';
function norV(){const v=(window.speechSynthesis&&speechSynthesis.getVoices())||[];const L=x=>(x.lang||'').replace('_','-');const no=v.filter(x=>/^(nb|no|nn)(-|$)/i.test(L(x))||/norw|norsk|bokm|nynorsk/i.test(x.name));const sc=x=>(/premium|enhanced|natural|neural|online|google/i.test(x.name)?4:0)+(/^nb/i.test(L(x))?2:0)+(/^no(-|$)/i.test(L(x))?1:0)+(x.localService?0:0.5);return no.sort((a,b)=>sc(b)-sc(a))}
function pickVoice(){const l=norV();VO=l.find(x=>x.name===S.voice)||l[0]||null}
try{speechSynthesis.onvoiceschanged=()=>{pickVoice();render()}}catch(e){}
pickVoice();
function toast(t){let d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;padding:12px 14px;border-radius:18px;background:rgba(10,40,90,.55);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);color:#fff;font-size:14px;z-index:9;transition:opacity .3s';document.body.appendChild(d)}d.textContent=t;d.style.opacity=1;clearTimeout(d._t);d._t=setTimeout(()=>d.style.opacity=0,5000)}
const canSay=t=>!!t&&!/[а-яё]/i.test(t);
const cleanT=t=>t.replace(/\bei\/en\b/,'en').replace(/[–\/]/g,', ').replace(/\s*\+\s*inf\./,'');
function speakOnline(t){try{speechSynthesis.cancel()}catch(e){}if(window._au)window._au.pause();const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=no&q='+encodeURIComponent(cleanT(t)));a.playbackRate=S.slow?.7:1;window._au=a;a.onerror=()=>{toast('Онлайн-голос недоступен здесь — переключаюсь на голос устройства.');S.online=false;save();render()};a.play().catch(()=>a.onerror())}
function nextVoice(){const l=norV();if(l.length<2){toast('Другого норвежского голоса на устройстве нет — установите ещё один в настройках системы.');return}const k=l.findIndex(x=>VO&&x.name===VO.name);S.voice=l[(k+1)%l.length].name;save();pickVoice();render();speak('Hei! Jeg heter Nora.')}
function speak(t,e){if(e)e.stopPropagation();if(!canSay(t))return;if(S.online){speakOnline(t);return}if(!window.speechSynthesis){toast('Ваш браузер не поддерживает синтез речи.');return}try{pickVoice();if(!VO){toast('Норвежский голос не найден на устройстве. Установите его в настройках системы (Речь / Языки → Norsk bokmål) или включите 🌐 онлайн-голос.');return}const u=new SpeechSynthesisUtterance(cleanT(t));u.voice=VO;u.lang=VO.lang.replace('_','-');u.rate=S.slow?.6:.9;u.pitch=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){}}
const sayCard=e=>speak(deck[i].no,e),sayEx=e=>speak(deck[i].ex,e);
function mark(v){if(i>=deck.length)return;S.st[deck[i].id]=v;save();i++;flip=false;render()}
function cnt(){const a=cards();let k=0,u=0;a.forEach(c=>{if(S.st[c.id]==='k')k++;else if(S.st[c.id]==='u')u++});return{k,u,n:a.length-k-u,t:a.length}}
function render(){
 ['study','list','add'].forEach(t=>$('t-'+t).className=t===tab?'on':'');
 const n=cnt(),st=`<div class="stats"><span>✅ знаю <b>${n.k}</b></span><span>🟠 не знаю <b>${n.u}</b></span><span>⚪ новые <b>${n.n}</b></span><span>всего <b>${n.t}</b></span></div>`;
 let h='';
 if(tab==='study'){
  h+=`<div class="row"><select onchange="cat=this.value;build();render()"><option value="">Все темы</option>${cats().map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <select onchange="mode=this.value;build();render()">${[['todo','Не знаю + новые'],['new','Только новые'],['all','Все'],['known','Знаю']].map(m=>`<option value="${m[0]}" ${m[0]===mode?'selected':''}>${m[1]}</option>`).join('')}</select>
  <button class="ib" title="Перемешать" onclick="shuf()">🔀</button><button class="ib" title="Сменить направление" onclick="S.dir^=1;save();render()">⇄</button><button class="ib ${S.slow?'on2':''}" title="Медленная речь" onclick="S.slow=!S.slow;save();render()">🐢</button><button class="ib ${S.auto?'on2':''}" title="Автоозвучка" onclick="S.auto=!S.auto;save();lastK='';render()">🔈</button><button class="ib ${S.online?'on2':''}" title="Онлайн-голос (Google)" onclick="S.online=!S.online;save();render()">🌐</button></div>${st}${S.online?'<div class="stats">🌐 Онлайн-голос Google (текст отправляется в Google)</div>':VO?`<div class="stats">🎙 ${esc(VO.name)} · ${esc(VO.lang)} <button class="sm" onclick="nextVoice()">сменить голос</button></div>`:'<div class="stats">⚠️ Норвежский голос не найден на этом устройстве — установите его в настройках системы или включите 🌐.</div>'}`;
  if(!deck.length)h+=`<div class="empty">В этой подборке нет карточек 🎉<br>Смените фильтр или добавьте новые.</div>`;
  else if(i>=deck.length)h+=`<div class="empty">Колода пройдена! 🎉<br><br><button class="pri" onclick="build();render()">Ещё раз (по текущему фильтру)</button></div>`;
  else{const c=deck[i],f=S.dir?c.ru:c.no,b=S.dir?c.no:c.ru;
   h+=`<div class="stats"><span>Карточка ${i+1} / ${deck.length}</span></div>
   <div class="card" onclick="flip=!flip;render()"><span class="cat">${esc(c.cat)}</span>${canSay(c.no)?`<button class="spk" onclick="sayCard(event)">🔊</button>`:''}
   <div class="big">${esc(f)}</div>${flip?`<div class="ans">${esc(b)}</div>${c.ex?`<div class="ex">${esc(c.ex)} ${canSay(c.ex)?`<button class="sm" onclick="sayEx(event)">🔊</button>`:''}</div>`:''}`:`<div class="hint">нажмите, чтобы перевернуть</div>`}</div>
   <div class="act"><button class="bn" onclick="mark('u')">Не знаю</button><button class="bk" onclick="mark('k')">Знаю</button></div>`}
 }else if(tab==='list'){
  const all=cards().filter(c=>!q||(c.no+c.ru).toLowerCase().includes(q.toLowerCase()));
  h+=`${st}<div class="row"><input id="q" placeholder="Поиск…" value="${esc(q)}" oninput="q=this.value;render();$('q').focus();$('q').setSelectionRange(q.length,q.length)"><button class="ib" onclick="if(rst){S.st={};save();rst=false}else rst=true;render()">${rst?'Точно сбросить?':'Сбросить'}</button></div>`;
  h+=all.map(c=>`<div class="item"><span class="dot ${S.st[c.id]||''}"></span><div class="t">${esc(c.no)}<small>${esc(c.ru)}</small></div>
  <button class="sm" onclick="S.st['${c.id}']='k';save();render()">✓</button><button class="sm" onclick="S.st['${c.id}']='u';save();render()">✗</button>${c.id[0]==='c'?`<button class="sm" onclick="S.cu=S.cu.filter(x=>x.id!=='${c.id}');delete S.st['${c.id}'];save();render()">🗑</button>`:''}</div>`).join('')||'<div class="empty">Ничего не найдено</div>';
 }else{
  h+=`<label>По-норвежски</label><input id="a-no" autocomplete="off"><label>Перевод</label><input id="a-ru" autocomplete="off">
  <label>Тема</label><input id="a-cat" list="cl" value="Мои слова"><datalist id="cl">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <label>Пример (необязательно)</label><input id="a-ex" autocomplete="off"><button class="pri" onclick="add()">Добавить карточку</button><div class="msg">${msg}</div>`;
 }
 if(tab==='study'&&S.auto&&deck[i]){const c=deck[i],k=c.id+S.dir+flip;if(k!==lastK&&(S.dir?flip:!flip)){lastK=k;speak(c.no)}}
 $('v').innerHTML=h;
}
const $=id=>document.getElementById(id);
function add(){const no=$('a-no').value.trim(),ru=$('a-ru').value.trim();if(!no||!ru){msg='Заполните оба поля';render();return}
 S.cu.push({id:'c'+Date.now(),no,ru,cat:$('a-cat').value.trim()||'Мои слова',ex:$('a-ex').value.trim()});save();msg='✓ Добавлено! Всего карточек: '+cards().length;render();$('a-no').focus()}
document.addEventListener('keydown',e=>{if(tab!=='study'||/INPUT|SELECT/.test(e.target.tagName))return;
 if(e.key===' '||e.key==='Enter'){e.preventDefault();flip=!flip;render()}else if(e.key==='ArrowLeft')mark('u');else if(e.key==='ArrowRight')mark('k')});
build();render();
</script></body></html>
