<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>@zagagulena</title>
    <meta name="theme-color" content="#1e7fd8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Настройки (меняются из JS) */
            --c-r: 255; --c-g: 255; --c-b: 255;
            --a1: .26; --a2: .07; --a3: .14;   /* прозрачность «стекла» */
            --bg-img: none;
            --bg-color: #1e7fd8;
            --tint: 0;                          /* насколько цвет фона проступает поверх фото */

            --tx: #fff;
            --mut: rgba(255, 255, 255, .92);
            --ctx: #fff;                        /* цвет текста на карточках */
            --scrim: rgba(8, 28, 70, .40);      /* тёмная подложка под «стеклом» — текст читается на любом фоне */
            --tsh: 0 1px 2px rgba(0, 20, 60, .6);
            --ctsh: var(--tsh);
            --cmut: rgba(255, 255, 255, .9);
            --ac: #ff6b81;
            --ok: #4cd9a0;
            --no: #ffb04d;

            --bd: rgba(var(--c-r), var(--c-g), var(--c-b), .35);
            --glass: linear-gradient(var(--scrim), var(--scrim)), linear-gradient(135deg, rgba(var(--c-r), var(--c-g), var(--c-b), var(--a1)), rgba(var(--c-r), var(--c-g), var(--c-b), var(--a2)) 55%, rgba(var(--c-r), var(--c-g), var(--c-b), var(--a3)));
            --blur: blur(14px);
            --edge: inset 0 1px 1px rgba(255, 255, 255, .5), 0 4px 14px rgba(0, 30, 90, .22);
        }

        /* Заставка запуска */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity .7s ease;
            touch-action: none;
        }
        #splash.out { opacity: 0; pointer-events: none; }
        #splash img { width: min(74vw, 340px); height: auto; display: block; opacity: 0; transform: scale(.96); animation: spIn .7s ease-out .1s forwards; pointer-events: none; -webkit-user-drag: none; }
        @keyframes spIn { to { opacity: 1; transform: none; } }
        body.splashing { overflow: hidden; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; padding: 0; }

        /* Карточка при вылете уходит за экран — не даём странице ехать вбок вместе с фоном */
        html, body {
            overflow-x: hidden;
            overflow-x: clip;
            max-width: 100%;
            overscroll-behavior-x: none;
        }
        body { touch-action: pan-y pinch-zoom; }

        body {
            color: var(--tx);
            font: 500 17px/1.45 system-ui, -apple-system, "SF Pro Display", Segoe UI, Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg-color);
            text-shadow: var(--tsh);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            -webkit-text-size-adjust: 100%;
        }

        /* Фон отдельным фиксированным слоем: background-attachment:fixed глючит на iOS */
        body::before {
            content: "";
            transform: translateZ(0);
            position: fixed;
            inset: 0;
            z-index: -2;
            background: var(--bg-img) center / cover no-repeat;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg-color);
            opacity: var(--tint);
            pointer-events: none;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 { font-size: 24px; margin: 4px 2px 0; font-weight: 700; }

        /* Логотип: стеклянные капли */
        h1.logo { margin: 0 0 4px; padding: 0; text-align: center; line-height: 0; font-size: 0; }
        h1.logo img {
            width: min(66vw, 240px);
            height: auto;
            display: inline-block;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
            animation: floaty 5s ease-in-out infinite alternate;
        }
        @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-4px); } }
        @media (prefers-reduced-motion: reduce) { h1.logo img { animation: none; } }

        /* Нижняя навигация — под большой палец */
        nav {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            width: calc(100% - 24px);
            max-width: 536px;
            z-index: 10;
            display: flex;
            gap: 4px;
            padding: 6px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transition: transform .2s ease, opacity .2s ease;
        }
        /* Прячем меню, когда открыта клавиатура */
        body.typing nav { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
        /* Свайп вниз прячет меню */
        body.nav-hide nav { transform: translate(-50%, 140%); opacity: 0; pointer-events: none; }
        /* Свайп вверх возвращает меню, даже если открыта клавиатура */
        body.typing.nav-peek nav { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }

        button, select, input { font: inherit; color: var(--ctx); text-shadow: inherit; margin: 0; }
        .card, .item, .panel, nav, select, input, textarea, .ib, .sm { text-shadow: var(--ctsh); }

        nav button {
            flex: 1;
            min-height: 48px;
            padding: 0 6px;
            font-size: 16px;
            font-weight: 700;
            border: 0;
            background: transparent;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s ease;
            white-space: nowrap;
        }
        nav button#t-settings { flex: 0 0 56px; font-size: 18px; }
        nav button.on { background: rgba(255, 255, 255, .3); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 2px 10px rgba(0, 30, 90, .25); }

        .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }

        select, input, textarea, .ib, .sm, .pick {
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
        }

        select, input[type="text"], input:not([type]), textarea {
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 16px;      /* 16px — чтобы iOS не зумил страницу при фокусе */
            width: 100%;
            min-width: 0;
            outline: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        select option { color: #123; }
        input::placeholder { color: var(--cmut); }
        input:focus, select:focus { border-color: rgba(255, 255, 255, .8); }

        .row select, .row .pick { flex: 1 1 100%; }
        @media (min-width: 400px) { .row select, .row .pick { flex: 1; } }

        .ib {
            min-height: 52px;
            padding: 0 18px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats { display: flex; gap: 6px 12px; font-size: 15px; font-weight: 600; color: var(--mut); margin: 2px 2px 8px; flex-wrap: wrap; justify-content: center; text-align: center; }
        .stats b { color: var(--tx); font-weight: 800; }

        .card {
            position: relative;
            overflow: hidden;
            background: var(--glass);
            border: 1px solid var(--bd);
            border-radius: 32px;
            min-height: 300px;
            min-height: min(52dvh, 420px);
            padding: 40px 20px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            color: var(--ctx);
                                    box-shadow: var(--edge);
            transition: transform .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }
        .card { transform-origin: 50% 100%; will-change: transform; }
        .card:active { transform: scale(.97); }
        .card.drag { transition: none; }
        .card.enter { animation: cardIn .28s ease-out; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.95); } to { opacity: 1; transform: none; } }
        /* Затемнение с цветом стороны, проступает по мере смещения карточки */
        .card > .shade {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(rgba(0, 20, 50, .3), rgba(0, 20, 50, .3)), var(--sc, transparent);
        }
        .card > .stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            translate: -50% -50%;
            opacity: 0;
            pointer-events: none;
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            padding: 8px 18px;
            border: 3px solid #fff;
            border-radius: 16px;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 30, 90, .45);
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 60% at 15% 0, rgba(255, 255, 255, .35), transparent 55%);
            pointer-events: none;
        }
        .card > * { position: relative; }
        .card .cat { position: absolute; top: 18px; left: 22px; font-size: 14px; color: var(--cmut); font-weight: 700; letter-spacing: .02em; }
        .card .big { font-size: 36px; font-weight: 800; overflow-wrap: anywhere; line-height: 1.2; }
        .card .ans { font-size: 28px; font-weight: 650; margin-top: 14px; color: var(--ctx); opacity: 1; line-height: 1.25; overflow-wrap: anywhere; }
        .card .ex { margin-top: 18px; color: var(--cmut); font-style: normal; font-weight: 500; font-size: 19px; line-height: 1.4; }
        .card .hint { position: absolute; bottom: 16px; font-size: 15px; font-weight: 600; color: var(--cmut); opacity: .85; }

        .act { display: flex; gap: 12px; margin-top: 4px; }
        .act button {
            flex: 1;
            min-height: 60px;
            padding: 0 12px;
            border-radius: 24px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transition: transform .1s;
        }
        .act button:active { transform: scale(.95); }
        .bn { background: linear-gradient(135deg, rgba(255, 176, 77, .65), rgba(255, 176, 77, .25)); }
        .bk { background: linear-gradient(135deg, rgba(76, 217, 160, .65), rgba(76, 217, 160, .25)); }
        .swipe-tip { text-align: center; font-size: 14px; font-weight: 600; color: var(--mut); margin-top: 2px; }

        .empty { text-align: center; color: var(--mut); padding: 48px 20px; font-size: 18px; line-height: 1.5; }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 12px 12px 16px;
            margin-bottom: 10px;
            border-radius: 20px;
            color: var(--ctx);
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
        }
        .item .t { flex: 1; min-width: 0; font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
        .item .t small { display: block; color: var(--cmut); font-size: 15px; margin-top: 2px; font-weight: 500; }

        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, .35); flex: none; margin-right: 4px; }
        .dot.k { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
        .dot.u { background: var(--no); box-shadow: 0 0 10px var(--no); }

        .sm {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            padding: 0;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sm.armed { width: auto; padding: 0 12px; font-size: 14px; font-weight: 650; background: linear-gradient(135deg, rgba(255, 90, 90, .75), rgba(255, 90, 90, .35)); color: #fff; }
        .del-cur { margin-top: 6px; min-height: 44px; font-size: 15px; font-weight: 500; }
        .del-cur.armed { background: linear-gradient(135deg, rgba(255, 90, 90, .7), rgba(255, 90, 90, .3)); box-shadow: var(--edge); }

        label { display: block; font-size: 15px; color: var(--mut); margin: 14px 4px 6px; font-weight: 650; }

        .pri {
            margin-top: 20px;
            width: 100%;
            min-height: 56px;
            padding: 0 18px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, .4), rgba(255, 255, 255, .12));
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transition: transform .1s;
        }
        .pri:active { transform: scale(.97); }
        .pri.ghost { background: transparent; box-shadow: none; margin-top: 10px; }
        .pri.sec { margin-top: 10px; background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.06)); }

        .item .t small.loc { font-size: 12px; opacity: .85; letter-spacing: .02em; }
        .dup { margin: 10px 0 4px; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); font-size: 15px; }
        .dup-h { display: flex; align-items: center; gap: 8px; font-weight: 700; }
        .dup-h .i { width: 18px; height: 18px; flex: none; }
        .dup.ok .dup-h { color: var(--ok); } .dup.warn .dup-h { color: var(--no); } .dup.bad .dup-h { color: var(--ac); }
        .dup-r { margin-top: 6px; } .dup-r small { display: block; font-size: 12px; opacity: .85; }
        .msg { color: #d6ffee; margin-top: 14px; min-height: 20px; text-align: center; font-weight: 500; }

        /* ---------- Настройки ---------- */
        .panel {
            padding: 4px 16px 16px;
            margin-bottom: 12px;
            border-radius: 24px;
            color: var(--ctx);
            background: var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
        }
        .panel label { color: var(--cmut); margin-left: 0; }

        .swatches { display: flex; flex-wrap: wrap; gap: 12px 4px; align-items: flex-start; }
        .swb { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 78px; }
        .swb > span { font-size: 12px; font-weight: 650; line-height: 1.15; text-align: center; color: var(--cmut); }
        .cur { font-size: 15px; color: var(--cmut); margin: -4px 0 12px; }
        .cur b { color: var(--ctx); font-weight: 800; }
        .hint2 { font-size: 14px; color: var(--cmut); margin: 0 0 12px; line-height: 1.35; }

        /* Предпросмотр: как будет выглядеть карточка на выбранном фоне */
        .pv { position: relative; isolation: isolate; overflow: hidden; border-radius: 24px; padding: 14px 16px 18px; margin-bottom: 12px; background: var(--bg-color); border: 1px solid var(--bd); }
        .pv::before { content: ""; position: absolute; inset: 0; z-index: -2; background: var(--bg-img) center / cover no-repeat; }
        .pv::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--bg-color); opacity: var(--tint); }
        .pv-cap { font-size: 13px; font-weight: 700; color: var(--tx); text-align: center; margin-bottom: 10px; }
        .pv-card { border-radius: 22px; padding: 16px 16px 22px; text-align: center; background: var(--glass); border: 1px solid var(--bd); box-shadow: var(--edge); color: var(--ctx); text-shadow: var(--ctsh); }
        .pv-card small { display: block; text-align: left; font-size: 13px; font-weight: 700; color: var(--cmut); }
        .pv-card b { display: block; font-size: 30px; font-weight: 800; margin-top: 6px; }
        .pv-card span { display: block; font-size: 22px; font-weight: 650; margin-top: 4px; }

        /* Переключатель «Сплошной цвет / Фото» */
        .seg { display: flex; gap: 4px; padding: 4px; margin: 10px 0 14px; border-radius: 18px; background: rgba(0, 20, 60, .28); }
        .seg button { flex: 1; min-height: 46px; padding: 0 8px; border: 0; border-radius: 14px; background: transparent; color: var(--ctx); font-size: 15px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: .2s; }
        .seg button.on { background: rgba(255, 255, 255, .38); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7), 0 2px 8px rgba(0, 30, 90, .25); }

        .sw {
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .55);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 30, 90, .3);
            background-clip: padding-box;
            flex: none;
        }
        /* Кнопки выбора (тема / режим) */
        .pick { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 14px 8px 16px; border-radius: 16px; cursor: pointer; text-align: left; color: var(--ctx); transition: transform .12s; min-width: 0; }
        .pick:active { transform: scale(.98); }
        .pick .pk-t { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
        .pick .pk-l { font-size: 12px; font-weight: 700; color: var(--cmut); letter-spacing: .05em; text-transform: uppercase; }
        .pick .pk-v { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pick .i { transition: transform .3s cubic-bezier(.2, .9, .3, 1); }
        .pick.open .i { transform: rotate(180deg); }

        /* Нижняя панель выбора */
        .sheet { position: fixed; inset: 0; z-index: 500; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
        .sheet.show { pointer-events: auto; }
        .sh-bd { position: absolute; inset: 0; background: rgba(0, 15, 45, .45); opacity: 0; transition: opacity .3s ease; }
        .sheet.show .sh-bd { opacity: 1; }
        .sh-pn {
            --ctx: #fff; --cmut: rgba(255, 255, 255, .85); --ctsh: var(--tsh);
            position: relative;
            width: calc(100% - 16px);
            max-width: 544px;
            margin: 0 8px calc(8px + env(safe-area-inset-bottom, 0px));
            max-height: 78vh; max-height: 78dvh;
            display: flex; flex-direction: column;
            border-radius: 30px;
            color: #fff;
            text-shadow: var(--tsh);
            background: linear-gradient(rgba(8, 28, 70, .66), rgba(8, 28, 70, .66)), var(--glass);
            border: 1px solid var(--bd);
                                    box-shadow: var(--edge);
            transform: translateY(112%);
            transition: transform .4s cubic-bezier(.2, .9, .25, 1.05);
        }
        .sheet.show .sh-pn { transform: none; }
        .sh-pn.drag { transition: none; }
        .sh-hd { padding: 10px 22px 4px; touch-action: none; }
        .sh-grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .55); margin: 0 auto 12px; }
        .sh-t { font-size: 20px; font-weight: 800; margin: 2px 0 6px; }
        .sh-l { overflow-y: auto; padding: 4px 10px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .opt {
            display: flex; align-items: center; gap: 12px;
            width: 100%; min-height: 60px; padding: 10px 14px; margin: 0 0 6px;
            border: 1px solid transparent; border-radius: 20px;
            background: transparent; color: #fff; text-align: left; cursor: pointer;
            opacity: 0;
            animation: optIn .4s cubic-bezier(.2, .9, .3, 1) forwards;
            animation-delay: calc(140ms + var(--k, 0) * 34ms);
            transition: background .2s, border-color .2s, transform .1s;
        }
        .opt:active { transform: scale(.98); }
        .opt.on { background: rgba(255, 255, 255, .2); border-color: rgba(255, 255, 255, .45); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .5); }
        .op-i { flex: none; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 4px; background: rgba(255, 255, 255, .14); }
        .op-i .dot { width: 10px; height: 10px; margin: 0; }
        .op-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .op-t b { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
        .op-t small { font-size: 13px; color: rgba(255, 255, 255, .8); font-weight: 500; margin-top: 1px; }
        .opt em { flex: none; font-style: normal; font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, .9); background: rgba(255, 255, 255, .15); padding: 2px 10px; border-radius: 999px; }
        .op-c { flex: none; width: 24px; display: flex; justify-content: center; }
        .op-c .i { width: 22px; height: 22px; stroke-width: 3; color: var(--ok); }
        @keyframes optIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        body.sheet-open { overflow: hidden; }

        /* Темы-«чипсы» при добавлении карточки */
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
        .chip { min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 650; cursor: pointer; color: var(--ctx); text-shadow: var(--ctsh); background: var(--glass); border: 1px solid var(--bd); box-shadow: var(--edge); transition: transform .12s, background .2s; }
        .chip:active { transform: scale(.95); }
        .chip.on { background: linear-gradient(rgba(255, 255, 255, .38), rgba(255, 255, 255, .38)), var(--glass); border-color: rgba(255, 255, 255, .8); }

        /* Награды за серию правильных ответов */
        .streak { display: inline-flex; align-items: center; gap: 5px; padding: 2px 11px; border-radius: 999px; font-weight: 800; color: #fff; background: rgba(255, 176, 77, .28); border: 1px solid rgba(255, 176, 77, .65); box-shadow: 0 0 14px rgba(255, 176, 77, .35); }
        .streak .i { width: 1.05em; height: 1.05em; color: #ffd08a; }
        .streak.pop { animation: streakPop .5s cubic-bezier(.2, 1.4, .4, 1); }

    /* Заставка: логотип на белом фоне появляется, держится пару секунд и плавно исчезает. Касание — пропустить. */
    (function () {
        const el = document.getElementById('splash');
        document.body.classList.add('splashing');
        let done = false;
        function end() {
            if (done) return; done = true;
            el.classList.add('out');
            document.body.classList.remove('splashing');
            setTimeout(() => el.remove(), 800);
        }
        el.addEventListener('click', end);
        el.innerHTML = '<img alt="Карточки от Сани">';
        el.firstChild.src = 'data:image/webp;base64,' + document.getElementById('intro-logo').textContent.trim();
        setTimeout(end, 2200);
    })();
    </script>

                if (/^k(?=[iy])/.test(r)) { U.push({ s: 'щ' }); p++; continue; }
                if (/^(hj|gj|lj|dj)/.test(r)) { U.push({ s: 'й' }); p += 2; continue; }
                if (p === 0 && /^hv/.test(r)) { U.push({ s: 'в' }); p += 2; continue; }
                if (/^ck/.test(r)) { U.push({ s: 'кк' }); p += 2; continue; }
                if (prevV() && (m = /^r([tdlns])/.exec(r))) { U.push({ s: { t: 'т', d: 'д', l: 'л', n: 'н', s: 'ш' }[m[1]] }); p += 2; continue; }
                if ((m = /^([bdfgklmnprstvz])\1/.exec(r))) { const c = TR_C[m[1]]; U.push({ s: c + c }); p += 2; continue; }
                if (/^g(?=ei|ey|øy|[iyø])/.test(r)) { U.push({ s: 'й' }); p++; continue; }
                if (/^(ei|ey)/.test(r)) { U.push({ s: 'эй', v: 1 }); p += 2; continue; }
                if (/^øy/.test(r)) { U.push({ s: 'ӧй', v: 1 }); p += 2; continue; }
                if (/^au/.test(r)) { U.push({ s: 'эю', v: 1 }); p += 2; continue; }
                const ch = r[0];
                if (ch === 'o') {
                    const k = /^o([^aeiouyæøåé]*)/.exec(r)[1].length;   // долгое [uː] перед одной согласной, краткое [ɔ] перед группой

            U.forEach((u, k) => { if (u.v) nuc.push(k); });

        /* ---------- Поиск: без учёта регистра, å/ø/æ можно писать как a/o/ae, ё = е ---------- */
        const FOLD = { 'ё': 'е', 'å': 'a', 'ø': 'o', 'æ': 'ae', 'é': 'e', 'è': 'e', 'ê': 'e', 'ó': 'o', 'ò': 'o', 'ü': 'u', 'ö': 'o', 'ä': 'a', 'ӧ': 'о', 'ӱ': 'у' };

                if (low[k] === '\u0301') continue;

        function hl(text, toks) {

            for (let k = 1; k < text.length; k++) if (text[k] === '\u0301') on[k] = on[k - 1];

                if (!w || w.includes(' ') || w.length < 3) continue;
                f.add(w);
                ['a', 'e', 'en', 'et', 'er', 'ene', 's', 't', 'te', 'de', 'r'].forEach(x => f.add(w + x));
                if (w.endsWith('e') && w.length > 3) { const w0 = w.slice(0, -1); ['', 'er', 'et', 'te', 'de', 't', 'a', 'ene', 'en'].forEach(x => f.add(w0 + x)); }
            }
            return f;
        }
        const exScore = t => Math.abs(t.length - 38);
        const exHas = (text, words, forms) => {
            const fx = fold(text);
            if (words.some(w => w.includes(' ') && fx.includes(w))) return true;
            return forms.size > 0 && fx.split(/[^a-z0-9]+/).some(t => forms.has(t));
        };
        function localEx(words, forms) {
            const out = [], seen = new Set();
            for (const c of cards()) {
                if (!c.ex || seen.has(c.ex)) continue;
                if (exHas(c.ex, words, forms)) { seen.add(c.ex); out.push({ t: c.ex, src: 'cards' }); }
            }
            return out.sort((a, b) => exScore(a.t) - exScore(b.t)).slice(0, 4);
        }
        /* Простые грамматически верные предложения — запасной вариант, если ничего больше не нашлось */
        function tmplList(base, ru) {
            const b = base.trim(), out = [];
            if (!b) return out;
            if (/^å /i.test(b)) {
                const v = b.slice(2).trim();
                if (v.length > 1) out.push('Jeg vil ' + v + '.', 'Kan du ' + v + '?', 'Vi skal ' + v + ' i morgen.', 'Hun pleier å ' + v + '.');
                return out;
            }
            const m = b.match(/^(en|ei|et)(?:\/(?:en|ei|et))? (.+)$/i);
            const noun = (art, w) => art === 'et'
                ? ['Jeg ser et ' + w + '.', 'Jeg har et ' + w + '.', 'Har du et ' + w + '?', 'Jeg trenger et ' + w + '.']
                : ['Det er en ' + w + '.', 'Jeg har en ' + w + '.', 'Har du en ' + w + '?', 'Jeg trenger en ' + w + '.'];
            if (m) return noun(m[1].toLowerCase(), m[2]);
            const r1 = String(ru || '').split(/[,;(]/)[0].trim().toLowerCase();
            if (/^[A-ZÆØÅ]/.test(b)) return ['Jeg vil gjerne se ' + b + '.', 'Jeg har aldri vært i ' + b + '.', 'Hva vet du om ' + b + '?'];
            if (!/\s/.test(b)) {
                if (/(ый|ий|ой|ая|ое|яя|ее)$/.test(r1)) return ['Han er ' + b + '.', 'Hun er ' + b + '.', 'Jeg er ' + b + '.'];   // прилагательное
                const g = nounGender(b);
                if (g) return noun(g, b);
            }
            return ['Hva betyr «' + b + '»?', 'Jeg kan ikke ordet «' + b + '».', 'Kan du forklare ordet «' + b + '»?'];
        }

        /* Род существительного для шаблона: берём у известного слова, которым оканчивается составное слово (takstein → stein),
           либо по надёжным окончаниям (-sjon, -ning, -het …) */
        let NGEN = null;
        function nounGender(w) {
            if (!NGEN) {
                NGEN = new Map();
                const add = no => { const m = String(no).match(/^(en|ei\/en|et|ei) (.+)$/i); if (m) { const h = m[2].toLowerCase().trim(); if (!NGEN.has(h)) NGEN.set(h, m[1].toLowerCase()); } };
                cards().forEach(c => add(c.no)); DICT.forEach(e => add(e.no));
            }
            const x = w.toLowerCase();
            if (NGEN.has(x)) return NGEN.get(x);
            for (let k = 1; k <= x.length - 3; k++) { const suf = x.slice(k); if (NGEN.has(suf)) return NGEN.get(suf); }
            if (/(else|ning|sjon|het|dom|ist|ør|ant)$/.test(x)) return 'en';
            if (/(ment|eri|um)$/.test(x)) return 'et';
            return '';
        }
        const flatTr = a => Array.isArray(a) ? a.flatMap(flatTr) : (a ? [a] : []);
        const clean = x => String(x || '').replace(/<[^>]*>/g, '').trim();
        /* Онлайн-источник 1: Tatoeba — настоящие предложения с русским переводом */
        const NETC = new Map();
        async function getJson(url, key) {
            if (NETC.has(key)) return NETC.get(key);
            let j = null;
            try {
                const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 4500);
                const r = await fetch(url, { signal: ctl.signal });
                clearTimeout(t);
                j = await r.json();
            } catch (e) {}
            if (j) NETC.set(key, j);
            return j;
        }
        async function tatoeba(w) {
            const j = await getJson('https://tatoeba.org/en/api_v0/search?from=nob&to=rus&orphans=no&unapproved=no&query=' + encodeURIComponent(w), 't:' + w.toLowerCase());
            return ((j && j.results) || []).map(x => ({ t: clean(x.text), ru: clean((flatTr(x.translations).find(y => y && y.lang === 'rus') || {}).text) }));
        }
        /* Онлайн-источник 2: память переводов MyMemory (шумнее, поэтому строже фильтр) */
        async function memEx(w) {
            const j = await getJson('https://api.mymemory.translated.net/get?langpair=no|ru&q=' + encodeURIComponent(w), 'm:' + w.toLowerCase());
            return ((j && j.matches) || []).map(x => ({ t: clean(x.segment), ru: clean(x.translation) }))
                .filter(x => /^[A-ZÆØÅ]/.test(x.t) && /[.!?]$/.test(x.t) && x.t.split(/\s+/).length >= 3 && !/[А-Яа-яЁё]/.test(x.t));
        }
        function aeBox(html) { const b = $('aex'); if (b) b.innerHTML = html; }
        function aeApply(i) {
            const e = AE && AE.list[i], ex = $('a-ex');
            if (!e || !ex) return;
            AE.i = i; ex.value = e.t; ex.dataset.m = '';
            aeBox(`<div class="lk-ok">${ic('sparkles')} Пример ${i + 1} из ${AE.list.length} · ${AE_SRC[e.src]}${e.ru ? '<br><i>' + esc(e.ru) + '</i>' : ''}</div><div class="chips"><button type="button" class="chip" onclick="exNext()">${ic('shuffle')} Другой пример</button></div>`);
        }
        const aePick = (arr, src) => arr.filter(x => x.t.length >= 10 && x.t.length <= 90 && !AE.list.some(y => y.t === x.t) && exHas(x.t, AE.words, AE.forms))
            .sort((a, b) => (!b.ru - !a.ru) || exScore(a.t) - exScore(b.t)).slice(0, 4).map(x => ({ t: x.t, ru: x.ru, src }));
        async function aeMore() {
            if (!AE || AE.onl) return;
            AE.onl = true;
            const key = AE.key;
            if (navigator.onLine !== false) {
                const [a, b] = await Promise.all([tatoeba(AE.q), memEx(AE.q)]);
                if (!AE || AE.key !== key) return;
                AE.list.push(...aePick(a, 'web'));
                if (AE.list.length < 3) AE.list.push(...aePick(b, 'web2'));
            }
            tmplList(AE.base, AE.ru).forEach(t => { if (!AE.list.some(y => y.t === t)) AE.list.push({ t, src: 'tmpl' }); });
        }
        async function autoEx() {
            const ex = $('a-ex'), no = $('a-no');
            if (!ex || !no || !$('aex')) return;
            const typed = no.value.trim();
            if (typed.length < 2) { AE = null; aeBox(''); if (ex.dataset.m !== '1') ex.value = ''; return; }
            const key = typed.toLowerCase();
            if (AE && AE.key === key) return;
            const r = lookupWord(typed), base = r && r.no ? r.no : typed;
            const ruEl = $('a-ru'), ru = (ruEl && ruEl.value.trim()) || (r && r.ru) || '';
            const words = [...new Set([fold(typed), fold(base)].map(x => x.replace(EX_ART, '')).filter(x => x.length >= 2))];
            const forms = exForms(words);
            AE = { key, base, ru, words, forms, q: base.replace(/^å /i, '').replace(/^(en|ei|et)(\/(en|ei|et))? /i, '').trim() || typed, list: localEx(words, forms), i: -1, onl: false };
            if (ex.dataset.m === '1') { aeBox(''); return; }          // свой пример пользователя не трогаем
            ex.value = '';                                            // старый автопример от прошлого слова убираем
            if (AE.list.length) { aeApply(0); return; }
            aeBox('<div class="lk-st">Подбираю пример…</div>');
            await aeMore();
            if (!AE || AE.key !== key || ex.dataset.m === '1') return;
            if (AE.list.length) aeApply(0); else aeBox('<div class="lk-st">Пример подобрать не удалось — можно написать свой.</div>');
        }
        async function exNext() {
            if (!AE) return;
            if (!AE.onl) {
                aeBox('<div class="lk-st">Ищу ещё примеры…</div>');
                const key = AE.key; await aeMore();
                if (!AE || AE.key !== key) return;
                if (AE.i + 1 < AE.list.length) { aeApply(AE.i + 1); return; }
            }
            if (AE.list.length < 2) { aeApply(0); aeBox($('aex').innerHTML + '<div class="lk-st">Других вариантов для этого слова нет — можно написать свой.</div>'); return; }
            aeApply((AE.i + 1) % AE.list.length);
        }

        let lkTimer = 0, lkSeq = 0, lkList = [];
        const lookupDeb = () => { clearTimeout(lkTimer); lkTimer = setTimeout(lookupRun, 250); };
        function chipsHtml(list, title) {
            lkList = list;
            return `<div class="lk-st">${title}</div><div class="lk-chips">${list.map((e, k) => `<button type="button" class="lk-chip" onclick="useSug(${k})">${esc(e.no)}<small>${esc(e.ru)}</small></button>`).join('')}</div>`;

        function useSug(k) {

        async function lookupRun() {
            const box = $('lk'), noEl = $('a-no'), ruEl = $('a-ru');
            if (!box || !noEl || !ruEl) return;
            const no = noEl.value.trim(), ruQ = ruEl.value.trim(), seq = ++lkSeq;
            if (!no) {

                box.innerHTML = s.length ? chipsHtml(s, 'Подсказки из словаря:') : '';
                return;
            }
            const r = lookupWord(no);
            if (r) {
                if (ruEl.dataset.m !== '1') ruEl.value = r.ru;
                chkDup();
                const diff = r.no.toLowerCase() !== no.toLowerCase();
                box.innerHTML = `<div class="lk-ok">${ic('check')} <b>${esc(r.no)}</b> — ${esc(r.ru)}${r.form ? ' <i>(форма слова)</i>' : ''}</div>` + (diff ? chipsHtml([r], 'Начальная форма:') : '');
                return;
            }
            const s = suggestWords(no);
            const online = no.length >= 3 && navigator.onLine !== false;
            box.innerHTML = (s.length ? chipsHtml(s, 'Возможно, вы имели в виду:') : '') + (online ? `<div class="lk-st">Ищу перевод онлайн…</div>` : `<div class="lk-st">Такого слова нет в словаре. Введите перевод сами.</div>`);
            if (!online) return;
            const tx = await onlineTr(no);
            if (seq !== lkSeq || !$('a-no') || $('a-no').value.trim() !== no) return;
            if (tx) {
                if (ruEl.dataset.m !== '1') ruEl.value = tx;
                chkDup();
                box.innerHTML = `<div class="lk-ok">${ic('sparkles')} Онлайн-перевод: <b>${esc(tx)}</b> — проверьте, прежде чем добавлять</div>` + (s.length ? chipsHtml(s, 'Или из словаря:') : '');
            } else {
                box.innerHTML = `<div class="lk-st">Не нашёл это слово. Введите перевод сами.</div>` + (s.length ? chipsHtml(s, 'Возможно, вы имели в виду:') : '');
            }
        }

        function setSt(id, v) {
            S.st[id] = v; save();
            const d = document.querySelector('.item[data-id="' + id + '"] .it-main .dot'); if (d) d.className = 'dot ' + v;
            $('stl').innerHTML = statsHtml();
        }
        /* Удаление: первое нажатие — «Удалить?», второе (в течение 3 сек) — удаляет */
        let armed = '', armT = 0;
        function disarm() { armed = ''; clearTimeout(armT); }
        function arm(id) {
            armed = id;
            clearTimeout(armT);
            armT = setTimeout(() => {

        function removeCard(id) {

            if (!c || busy) return;
            if (armed !== c.id) { arm(c.id); render(); return; }
            disarm(); removeCard(c.id);

            flip = false; enter = true; render();
        }
        function restoreDel() { S.del = []; save(); render(); }

        /* ---------- Рендер ---------- */
        const MODES = [
            ['todo', 'Не знаю + новые', 'Всё, что ещё стоит повторить'],
            ['new', 'Только новые', 'Карточки, которые вы ещё не отмечали'],
            ['all', 'Все', 'Вся колода без фильтра'],
            ['known', 'Знаю', 'Уже выученные — для повторения']

        const MODE_ICON = {
            todo: '<i class="dot u"></i><i class="dot n"></i>',

        /* ---------- Нижняя панель выбора ---------- */
        let shEl = null, shKind = '';
        function openPick(kind) {

                ? [['', 'Все главы', '', cards().length, ic('cards')]].concat(Object.keys(CHAPTERS).map(n => [n, (+n ? 'Глава ' + n + ' · ' : '') + CHAPTERS[n], '', cards().filter(x => String(chOf(x)) === n).length, ic('tag')]))
                : kind === 'cat'

                : MODES.map(m => [m[0], m[1], m[2], null, MODE_ICON[m[0]] || ic('cards')]);

                    <span class="op-i">${it[4]}</span>

                    ${it[3] !== null ? `<em>${it[3]}</em>` : ''}

            requestAnimationFrame(() => shEl && shEl.classList.add('show'));

            // свайп вниз по шапке закрывает панель

        function closePick() {

        function choosePick(v) {

        const CARD_COLORS = [['#ff6b81', 'Розовый'], ['#ffb04d', 'Оранжевый'], ['#4cd9a0', 'Мятный'], ['#5cb8ff', 'Голубой'], ['#a78bfa', 'Сиреневый'], ['#ffffff', 'Белый'], ['#1b2a41', 'Тёмный']];
        const BG_COLORS = [['#1e7fd8', 'Синий'], ['#0f766e', 'Бирюзовый'], ['#15803d', 'Зелёный'], ['#7c3aed', 'Фиолетовый'], ['#be185d', 'Малиновый'], ['#b45309', 'Янтарный'], ['#111827', 'Графит']];
        const swatches = (list, isOn, fn) => list.map(([c, n]) => { const on = isOn(c); return `<div class="swb"><button class="sw ${on ? 'on' : ''}" style="background:${c};${c === '#ffffff' ? 'color:#10243a;text-shadow:none;' : ''}" aria-label="${n}" onclick="${fn}('${c}')">${on ? ic('check') : ''}</button><span>${n}</span></div>`; }).join('');
        const picker = (key, val, on) => `<div class="swb"><div class="sw-custom ${on ? 'on' : ''}" style="${on ? 'background:' + val : ''}"><input type="color" value="${val}" aria-label="Свой цвет" oninput="S.${key}=this.value;applyTheme()" onchange="save();render()"></div><span>Свой</span></div>`;

        function render() {

                    <button class="pick" data-k="mode" onclick="openPick('mode')"><span class="pk-t"><span class="pk-l">Показывать</span><span class="pk-v">${esc((MODES.find(m => m[0] === mode) || MODES[0])[1])}</span></span>${ic('chevron')}</button>

                    ${solid ? `

                            ${swatches(BG_COLORS, c => c === bc, 'setBgColor')}

                    ` : `
                        ${BG ? `<div class="bg-preview" style="background-image:url('${BG}');margin-top:0"></div>` : `<div class="hint2">Сейчас стандартное фото. Можно выбрать своё.</div>`}
                        <div class="file-btn" style="margin-top:12px;">

            }

            enter = false; flipFx = false; streakPop = false;
            if (moreIO) { moreIO.disconnect(); moreIO = null; }
            $('v').innerHTML = h;
            if (tab === 'list') watchMore();
        }

        let flipFx = false, flipping = false;
        function doFlip() {
            const c = document.querySelector('.card');
            const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!c || flipping || calm) { flip = !flip; render(); return; }
            flipping = true;
            c.classList.add('flip-out');
            setTimeout(() => { flip = !flip; flipFx = true; flipping = false; render(); }, 170);
        }
        function tap() { if (swiped || busy || flipping) return; doFlip(); }

        function add() {
            const no = $('a-no').value.trim(), ru = $('a-ru').value.trim();
            if (!no || !ru) { msg = 'Заполните оба поля'; render(); return; }
            const d = findDup(no, ru), key = norm(no) + '|' + ru.toLowerCase();
            if (d.exact.length && dupArm !== key) {
                dupArm = key;
                msg = 'Это слово уже есть (' + loc(d.exact[0]) + '). Нажмите ещё раз, если всё равно хотите добавить.';
                render(); $('a-no').value = no; $('a-ru').value = ru; chkDup(); trFill(); dupArm = key; return;
            }
            dupArm = '';
            S.cu.push({ id: 'c' + Date.now(), no, ru, tr: $('a-tr').value.trim() || autoTr(no), cat: $('a-cat').value.trim() || 'Мои слова', ex: $('a-ex').value.trim(), ch: +chap || 0 });
            save(); AE = null;
            msg = ic('check') + ' Добавлено! Всего карточек: ' + cards().length;
            render();
            $('a-no').focus();
        }

        /* ---------- Мини-игры с персонажем ---------- */
        let G = null, gmMsg = '', gTimer = 0;
        const GAMES = [
            ['quiz', 'Выбери перевод', 'Угадай значение слова из четырёх вариантов', 'cards'],
            ['pairs', 'Найди пару', 'Соедини норвежские слова с их переводами', 'shuffle'],
            ['build', 'Собери слово', 'Составь слово из букв по русскому переводу', 'tag'],
            ['blitz', 'Блиц: верно или нет', '40 секунд и три жизни — отвечай быстро', 'flame']
        ];
        const G_OK = [['Så flott!', 'Здорово!'], ['Bra jobba!', 'Отлично!'], ['Riktig!', 'Верно!'], ['Supert!', 'Супер!'], ['Perfekt!', 'Идеально!'], ['Du er flink!', 'Ты молодец!']];
        const G_BAD = [['Nesten!', 'Почти!'], ['Prøv igjen!', 'Попробуй ещё!'], ['Ikke så farlig!', 'Не страшно!'], ['Neste gang!', 'В следующий раз!']];
        const G_NEED = { quiz: 4, pairs: 6, build: 5, blitz: 4 };
        const G_BEST = { quiz: v => v + ' из 10', pairs: v => 'ошибок: ' + v, build: v => v + ' из 8', blitz: v => v + ' верных' };

        const gmCls = t => t.length > 60 ? ' l2' : t.length > 28 ? ' l1' : '';   // длинный текст — мельче, чтобы кнопки не уезжали вниз
        const rnd = n => Math.random() * n | 0;
        const shuffled = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = rnd(k + 1);[a[k], a[j]] = [a[j], a[k]]; } return a; };
        const gPool = () => cards().filter(c => c.no && c.ru && (!cat || c.cat === cat) && (chap === '' || String(chOf(c)) === chap));
        const hap = ok => { try { if (ok) tg?.HapticFeedback?.impactOccurred('light'); else tg?.HapticFeedback?.notificationOccurred('error'); } catch (e) {} };
        const gmSvg = (pose, extra = '') => `<svg viewBox="30 0 140 165" aria-hidden="true">${mascot(pose)}${extra}</svg>`;
        const buildOk = c => { const t = c.no.trim().toLowerCase(), n = t.replace(/ /g, '').length; return /^[a-zæøå ]+$/.test(t) && t.split(' ').length <= 3 && n >= 3 && n <= 12; };

        function stopGame() { clearInterval(gTimer); if (G) clearTimeout(G.adv); G = null; }
        function gSay(ok, extra) {
            const sc = SCN[G.sc] || SCN.hello, base = ok ? G_OK : G_BAD, own = ok ? sc.ok : sc.bad, arr = own ? own.concat(base) : base;
            const p = arr[rnd(arr.length)];
            G.say = { pose: ok ? 'up' : 'down', b: p[0], s: extra || p[1] };
            G.anim = ok ? 'hop' : 'wob';
            hap(ok);
        }
        const gWrong = c => { S.st[c.id] = 'u'; save(); };   // ошибка в игре → слово попадает в «не знаю»

        function gShell(body, prog, scoreTxt, warn) {
            const s = G.say || { pose: 'wave', b: 'Hei! Lykke til!', s: 'Удачи!' };
            const an = G.swap ? 'swap' : (G.anim || ''); G.anim = ''; G.swap = false;
            return `
            <div class="gm-top">
                <button class="ib gm-x" aria-label="Выйти из игры" onclick="stopGame();render()">${ic('x')}</button>
                <div class="gm-bar ${warn ? 'warn' : ''}"><i id="gm-bi" style="width:${Math.max(0, Math.min(100, prog))}%"></i></div>
                <div class="gm-sc" id="gm-sc">${scoreTxt}</div>
            </div>
            <div class="gm-mas">${scnHtml(G.sc || 'hello', s.pose, an)}<div class="gm-say"><b>${esc(s.b)}</b><small>${esc(s.s)}</small></div></div>
            ${body}`;
        }

        const pickBtns = () => `
            <button class="pick" data-k="ch" onclick="openPick('ch')"><span class="pk-t"><span class="pk-l">Глава</span><span class="pk-v">${esc(chap === '' ? 'Все главы' : (+chap ? chap + ' · ' : '') + CHAPTERS[chap])}</span></span>${ic('chevron')}</button>
            <button class="pick" data-k="cat" onclick="openPick('cat')"><span class="pk-t"><span class="pk-l">Тема</span><span class="pk-v">${esc(cat || 'Все темы')}</span></span>${ic('chevron')}</button>`;

        function gamesMenuHtml() {
            const n = gPool().length;
            const pl = gPool(), sid = cat ? sceneFor({ cat }) : chap !== '' ? sceneOfPool(pl) : 'hello';
            return `
            <div class="gm-mas">${scnHtml(sid, 'wave', 'hop')}<div class="gm-say"><b>Hei! Давай играть!</b><small>Выбери игру. Слова берутся из выбранной ниже главы и темы, а ситуация с Кимом подстраивается под тему.</small></div></div>
            <div class="row">${pickBtns()}</div>
            <div class="stats"><span>Слов для игры: <b>${n}</b></span></div>
            ${gmMsg ? `<div class="msg" style="margin:0 0 10px">${gmMsg}</div>` : ''}
            <div class="gm-grid">${GAMES.map(g => {
                const b = (S.gm || {})[g[0]];
                return `<button class="gm-tile" onclick="startGame('${g[0]}')"><span class="gm-ti">${ic(g[3])}</span><span class="gm-tt"><b>${g[1]}</b><small>${g[2]}</small>${b != null ? `<em>Рекорд: ${G_BEST[g[0]](b)}</em>` : ''}</span></button>`;
            }).join('')}</div>`;
        }

        function startGame(kind) {
            stopGame();
            const pool = gPool();
            const elig = kind === 'build' ? pool.filter(buildOk) : pool;
            if (elig.length < G_NEED[kind]) {
                gmMsg = kind === 'build'
                    ? 'Для этой игры нужно хотя бы 5 коротких слов без артиклей и скобок. Выберите другую главу или тему.'
                    : `Для этой игры нужно минимум ${G_NEED[kind]} слов. Выберите другую главу или тему.`;
                render(); return;
            }
            gmMsg = '';
            const g = G = { kind, score: 0, n: 0, pool, elig, say: { pose: 'wave', b: 'Hei! Lykke til!', s: 'Удачи!' }, anim: 'hop' };
            if (kind === 'quiz') { g.deck = shuffled(elig).slice(0, 10); g.total = g.deck.length; quizQ(); }
            else if (kind === 'pairs') {
                let src = elig.filter(c => c.no.length <= 24 && c.ru.length <= 28);
                if (src.length < 6) src = elig;
                const ch = shuffled(src).slice(0, 6);
                setScene(g, sceneOfPool(ch)); g.L = shuffled(ch); g.R = shuffled(ch); g.got = new Set(); g.sel = null; g.bad = null; g.lock = false; g.mis = 0; g.total = 6;
            }
            else if (kind === 'build') { g.deck = shuffled(elig).slice(0, 8); g.total = g.deck.length; buildQ(); }
            else { g.lives = 3; g.limit = 40000; g.t0 = Date.now(); g.last = ''; blitzQ(); gTimer = setInterval(blitzTick, 200); }
            render();
            window.scrollTo(0, 0);
        }

        function renderGame() { if (tab !== 'games' || !G) return; $('v').innerHTML = G.done ? gEnd() : gameHtml(); }
        function gameHtml() { return { quiz: quizHtml, pairs: pairsHtml, build: buildHtml, blitz: blitzHtml }[G.kind](); }

        function gFinish() {
            clearInterval(gTimer);
            const g = G; if (!g || g.done) return;
            clearTimeout(g.adv);
            g.done = true;
            let stars, title, detail, val;
            if (g.kind === 'pairs') { val = g.mis; stars = val <= 1 ? 3 : val <= 3 ? 2 : 1; title = val === 0 ? 'Ни одной ошибки!' : 'Все пары найдены!'; detail = 'Ошибок: ' + val; }
            else if (g.kind === 'blitz') { val = g.score; stars = val >= 15 ? 3 : val >= 8 ? 2 : val >= 3 ? 1 : 0; title = g.lives <= 0 ? 'Жизни закончились' : 'Время вышло!'; detail = 'Верных ответов: ' + val; }
            else { val = g.score; const r = val / g.total; stars = r >= .9 ? 3 : r >= .6 ? 2 : r >= .3 ? 1 : 0; title = ['Не страшно, повторим!', 'Хорошее начало!', 'Хороший результат!', 'Великолепно!'][stars]; detail = 'Верно: ' + val + ' из ' + g.total; }
            S.gm = S.gm || {};
            const old = S.gm[g.kind];
            if (old == null || (g.kind === 'pairs' ? val < old : val > old)) { S.gm[g.kind] = val; g.record = !(old == null && val === 0 && g.kind !== 'pairs'); }
            save();
            g.res = { stars, title, detail };
            g.anim = stars >= 2 ? 'hop' : 'wob';
            renderGame();
            if (stars >= 2) { burst(innerWidth / 2, innerHeight / 3, 14 + stars * 8); try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (e) {} }
        }
        function gEnd() {
            const g = G, r = g.res, an = g.anim || ''; g.anim = '';
            const extra = r.stars === 3 ? `<g transform="translate(-4 6) scale(.85)">${PR.trophy}</g>` + PR.star(18, 26, 1.2) + PR.star(136, 104, 1.1) : r.stars >= 1 ? PR.star(18, 26, 1) : '';
            return `<div class="gm-end">
                ${scnHtml(g.sc || 'hello', r.stars >= 2 ? 'up' : r.stars === 1 ? 'wave' : 'down', 'big ' + an, extra)}
                <div class="gm-stars">${[1, 2, 3].map(k => `<span class="${k <= r.stars ? 'on' : ''}">${ic('star')}</span>`).join('')}</div>
                <h2>${esc(r.title)}</h2>
                <p>${esc(r.detail)}${g.record ? ' · новый рекорд!' : ''}</p>
                <button class="pri" onclick="startGame('${g.kind}')">${ic('undo')}Играть ещё раз</button>
                <button class="pri sec" onclick="stopGame();render()">К списку игр</button>
            </div>`;
        }

        /* --- 1. Выбери перевод --- */
        function setScene(g, sc) {
            if (g.sc === sc) return;
            g.sc = sc;
            const i = (SCN[sc] || SCN.hello).intro;
            g.say = { pose: 'wave', b: i[0], s: i[1] };
            g.swap = true;
        }
        function quizQ() {
            const g = G, c = g.deck[g.n], dir = Math.random() < .4 ? 1 : 0;
            setScene(g, sceneFor(c));   // 0: норв. → рус., 1: рус. → норв.
            const key = x => (dir ? x.no : x.ru).toLowerCase();
            const used = new Set([key(c)]), wrong = [];
            for (const src of [g.pool, cards()]) {
                for (const x of shuffled(src)) { if (wrong.length >= 3) break; const k = key(x); if (!used.has(k)) { used.add(k); wrong.push(x); } }
            }
            g.q = { c, dir, pick: -1, opts: shuffled([c].concat(wrong)).map(x => ({ c: x, ok: x === c })) };
        }
        function quizHtml() {
            const g = G, q = g.q, c = q.c, done = q.pick >= 0;
            const opts = q.opts.map((o, k) => {
                const cl = !done ? '' : o.ok ? 'ok' : k === q.pick ? 'bad' : 'dim';
                return `<button class="gm-opt ${cl}" ${done ? 'disabled' : ''} onclick="quizPick(${k})">${esc(q.dir ? o.c.no : o.c.ru)}</button>`;
            }).join('');
            const body = `
                <div class="gm-q"><div class="gm-l">Вопрос ${g.n + 1} из ${g.total} · ${q.dir ? 'Как по-норвежски?' : 'Что это значит?'}</div>
                    <div class="gm-w${gmCls(q.dir ? c.ru : c.no)}">${esc(q.dir ? c.ru : c.no)}</div></div>
                <div class="gm-opts">${opts}</div>
                ${done && !q.opts[q.pick].ok ? `<button class="pri" onclick="quizNext()">Дальше</button>` : ''}`;
            return gShell(body, (g.n + (done ? 1 : 0)) / g.total * 100, g.score);
        }
        function quizPick(k) {
            const g = G; if (!g || g.done || g.kind !== 'quiz') return;
            const q = g.q; if (q.pick >= 0) return;
            q.pick = k;
            const o = q.opts[k], c = q.c;
            if (o.ok) { g.score++; gSay(true, c.no + ' — ' + c.ru); g.adv = setTimeout(() => { if (G === g && !g.done && g.q === q) quizNext(); }, 1000); }
            else { gWrong(c); gSay(false, 'Правильно: ' + c.no + ' — ' + c.ru); }
            renderGame();
        }
        function quizNext() {
            const g = G; if (!g || g.done) return;
            clearTimeout(g.adv);
            g.n++;
            if (g.n >= g.total) { gFinish(); return; }
            quizQ(); renderGame();
        }

        /* --- 2. Найди пару --- */
        function pairsHtml() {
            const g = G;
            const col = (arr, side) => arr.map(c => {
                const cl = g.got.has(c.id) ? 'ok' : g.bad && g.bad.some(b => b.id === c.id && b.side === side) ? 'bad' : g.sel && g.sel.id === c.id && g.sel.side === side ? 'sel' : '';
                return `<button class="gm-p ${cl}" onclick="pairTap('${side}','${c.id}')">${esc(side === 'no' ? c.no : c.ru)}</button>`;
            }).join('');
            const body = `<div class="gm-hint">Выбери слово слева и его перевод справа</div><div class="gm-pairs"><div class="gm-col">${col(g.L, 'no')}</div><div class="gm-col">${col(g.R, 'ru')}</div></div>`;
            return gShell(body, g.got.size / g.total * 100, g.got.size + '/' + g.total);
        }
        function pairTap(side, id) {
            const g = G; if (!g || g.done || g.lock || g.got.has(id)) return;
            if (!g.sel || g.sel.side === side) { g.sel = { side, id }; hap(true); renderGame(); return; }
            const a = g.sel, b = { side, id };
            if (a.id === id) {
                g.got.add(id); g.sel = null;
                const c = g.L.find(x => x.id === id);
                gSay(true, c.no + ' — ' + c.ru);
                if (g.got.size >= g.total) { g.lock = true; g.adv = setTimeout(() => { if (G === g) gFinish(); }, 700); }
                renderGame();
            } else {
                g.mis++; g.bad = [a, b]; g.lock = true;
                gSay(false, 'Это не пара — попробуй ещё');
                renderGame();
                g.adv = setTimeout(() => { if (G !== g || g.done) return; g.bad = null; g.sel = null; g.lock = false; renderGame(); }, 650);
            }
        }

        /* --- 3. Собери слово --- */
        function buildQ() {
            const g = G, c = g.deck[g.n], t = c.no.trim().toLowerCase();
            setScene(g, sceneFor(c));
            g.q = {
                c, t, res: null, failed: false, hint: 0,
                slots: [...t].map(ch => ch === ' ' ? { ch, sp: 1 } : { ch, fill: null, tile: -1, lock: false }),
                tiles: shuffled([...t].filter(x => x !== ' ')).map(ch => ({ ch, used: false }))
            };
        }
        function buildHtml() {
            const g = G, q = g.q, c = q.c;
            const slots = q.slots.map((s, i) => s.sp ? '<div class="gm-slot sp"></div>' :
                `<button class="gm-slot ${s.fill !== null ? 'f' : ''} ${q.res === 'ok' ? 'ok' : ''} ${q.res === 'skip' ? 'rv' : ''} ${q.res === 'bad' && !s.lock ? 'bad' : ''} ${s.lock && !q.res ? 'lk' : ''}" onclick="bSlot(${i})">${s.fill !== null ? esc(s.fill.toUpperCase()) : ''}</button>`).join('');
            const tiles = q.tiles.map((t, k) => `<button class="gm-lt ${t.used ? 'used' : ''}" onclick="bTile(${k})">${esc(t.ch.toUpperCase())}</button>`).join('');
            const tools = q.res === null
                ? `<div class="gm-tools"><button class="pri sec" onclick="bHint()">Подсказка</button><button class="pri ghost" onclick="bSkip()">Не знаю</button></div>`
                : q.res === 'skip' ? `<button class="pri" onclick="bNext()">Дальше</button>` : '';
            const body = `
                <div class="gm-q"><div class="gm-l">Слово ${g.n + 1} из ${g.total} · Собери по-норвежски</div>
                    <div class="gm-w${gmCls(c.ru)}">${esc(c.ru)}</div></div>
                <div class="gm-slots">${slots}</div>
                <div class="gm-tiles">${tiles}</div>
                ${tools}`;
            return gShell(body, (g.n + (q.res === 'ok' || q.res === 'skip' ? 1 : 0)) / g.total * 100, g.score);
        }
        function bTile(k) {
            const g = G; if (!g || g.done) return;
            const q = g.q; if (q.res !== null) return;
            const t = q.tiles[k]; if (t.used) return;
            const idx = q.slots.findIndex(s => !s.sp && s.fill === null); if (idx < 0) return;
            q.slots[idx].fill = t.ch; q.slots[idx].tile = k; t.used = true;
            hap(true);
            bCheck();
        }
        function bSlot(i) {
            const g = G; if (!g || g.done) return;
            const q = g.q, s = q.slots[i];
            if (q.res !== null || s.sp || s.fill === null || s.lock) return;
            q.tiles[s.tile].used = false; s.fill = null; s.tile = -1;
            renderGame();
        }
        function bCheck() {
            const g = G, q = g.q;
            if (q.slots.some(s => !s.sp && s.fill === null)) { renderGame(); return; }
            const word = q.slots.map(s => s.sp ? ' ' : s.fill).join('');
            if (word === q.t) {
                q.res = 'ok';
                if (!q.failed && !q.hint) g.score++;
                gSay(true, q.c.no + ' — ' + q.c.ru);
                g.adv = setTimeout(() => { if (G === g && !g.done && g.q === q) bNext(); }, 1100);
            } else {
                q.res = 'bad'; q.failed = true;
                gWrong(q.c);
                gSay(false, 'Попробуй ещё раз');
                g.adv = setTimeout(() => {
                    if (G !== g || g.done || g.q !== q) return;
                    q.slots.forEach(s => { if (!s.sp && !s.lock) { if (s.tile >= 0) q.tiles[s.tile].used = false; s.fill = null; s.tile = -1; } });
                    q.res = null; renderGame();
                }, 800);
            }
            renderGame();
        }
        function bHint() {
            const g = G; if (!g || g.done) return;
            const q = g.q; if (q.res !== null) return;
            q.slots.forEach(s => { if (!s.sp && !s.lock && s.fill !== null && s.fill !== s.ch) { q.tiles[s.tile].used = false; s.fill = null; s.tile = -1; } });
            const s = q.slots.find(x => !x.sp && x.fill === null); if (!s) return;
            const k = q.tiles.findIndex(t => !t.used && t.ch === s.ch); if (k < 0) return;
            s.fill = s.ch; s.tile = k; s.lock = true; q.tiles[k].used = true; q.hint++;
            bCheck();
        }
        function bSkip() {
            const g = G; if (!g || g.done) return;
            const q = g.q; if (q.res !== null) return;
            q.slots.forEach(s => { if (!s.sp) { s.fill = s.ch; s.lock = true; } });
            q.tiles.forEach(t => t.used = true);
            q.res = 'skip';
            gWrong(q.c);
            gSay(false, 'Это слово: ' + q.c.no);
            renderGame();
        }
        function bNext() {
            const g = G; if (!g || g.done) return;
            clearTimeout(g.adv);
            g.n++;
            if (g.n >= g.total) { gFinish(); return; }
            buildQ(); renderGame();
        }

        /* --- 4. Блиц: верно или нет --- */
        function blitzQ() {
            const g = G;
            let c, k = 0;
            do { c = g.elig[rnd(g.elig.length)]; k++; } while (c.id === g.last && g.elig.length > 1 && k < 10);
            g.last = c.id;
            setScene(g, sceneFor(c));
            let truth = Math.random() < .5, shown = c;
            if (!truth) {
                const others = g.elig.filter(x => x.ru.toLowerCase() !== c.ru.toLowerCase());
                shown = others.length ? others[rnd(others.length)] : c;
                if (shown === c) truth = true;
            }
            g.q = { c, ru: shown.ru, truth, res: null };
        }
        function blitzHtml() {
            const g = G, q = g.q, c = q.c;
            const rem = Math.max(0, g.limit - (Date.now() - g.t0));
            const lives = [0, 1, 2].map(k => `<svg viewBox="-16 -16 32 30" width="28" height="26" class="${k < g.lives ? '' : 'lost'}">${PR.heart(0, 0, 1)}</svg>`).join('');
            const dis = q.res !== null ? 'disabled' : '';
            const body = `
                <div class="gm-lives">${lives}<span class="gm-time" id="gm-time">${Math.ceil(rem / 1000)} c</span></div>
                <div class="gm-q ${q.res === true ? 'ok' : q.res === false ? 'bad' : ''}">
                    <div class="gm-w${gmCls(c.no)}">${esc(c.no)}</div>
                    <div class="gm-eq">=</div>
                    <div class="gm-w alt${gmCls(q.ru)}">${esc(q.ru)}</div>
                </div>
                <div class="gm-tf">
                    <button class="gm-no" ${dis} onclick="blitzAns(false)">${ic('x')} Неверно</button>
                    <button class="gm-yes" ${dis} onclick="blitzAns(true)">${ic('check')} Верно</button>
                </div>`;
            return gShell(body, rem / g.limit * 100, g.score, rem < 10000);
        }
        function blitzAns(yes) {
            const g = G; if (!g || g.done || g.kind !== 'blitz') return;
            const q = g.q; if (q.res !== null) return;
            const ok = yes === q.truth;
            q.res = ok;
            if (ok) { g.score++; gSay(true, q.c.no + ' — ' + q.c.ru); }
            else { g.lives--; gWrong(q.c); gSay(false, 'Правильно: ' + q.c.no + ' — ' + q.c.ru); }
            renderGame();
            if (g.lives <= 0) { g.adv = setTimeout(() => { if (G === g) gFinish(); }, 900); return; }
            g.adv = setTimeout(() => { if (G !== g || g.done) return; blitzQ(); renderGame(); }, ok ? 550 : 1000);
        }
        function blitzTick() {
            const g = G;
            if (!g || g.kind !== 'blitz' || g.done) { clearInterval(gTimer); return; }
            const rem = Math.max(0, g.limit - (Date.now() - g.t0));
            const bi = $('gm-bi'), tm = $('gm-time');
            if (bi) { bi.style.width = (rem / g.limit * 100) + '%'; bi.parentNode.classList.toggle('warn', rem < 10000); }
            if (tm) tm.textContent = Math.ceil(rem / 1000) + ' c';
            if (rem <= 0) gFinish();
        }

        /* Свайп: карточка едет за пальцем, темнеет и подсвечивается; вправо — «знаю», влево — «не знаю» */
        let tx = 0, ty = 0, tcard = null, drag = false, swiped = false, busy = false;
        const TH = () => Math.min(120, window.innerWidth * 0.28);

        let pdx = 0, praf = 0;
        function paint(card, dx) {
            const sh = card._sh || (card._sh = card.querySelector('.shade')), st = card._st || (card._st = card.querySelector('.stamp'));
            card.style.transform = `translate3d(${dx}px,0,0) rotate(${dx / 18}deg) scale(1.02)`;
            const sg = dx > 0 ? 1 : -1;
            if (card._sg !== sg) {
                card._sg = sg;
                sh.style.setProperty('--sc', sg > 0 ? 'rgba(76,217,160,.8)' : 'rgba(255,176,77,.8)');
                st.textContent = sg > 0 ? 'Знаю' : 'Не знаю';
            }
            sh.style.opacity = Math.min(Math.abs(dx) / (TH() * 1.4), 1) * .9;
            st.style.opacity = Math.max(0, Math.min((Math.abs(dx) - 20) / TH(), 1));
        }
        function unpaint(card) {
            card.style.transform = '';
            card.querySelector('.shade').style.opacity = 0;
            card.querySelector('.stamp').style.opacity = 0;
        }
        function fling(card, v) {
            busy = true;
            const dir = v === 'k' ? 1 : -1;
            card.classList.remove('drag');
            card.style.transition = 'transform .28s ease-in, opacity .28s ease-in';
            card.style.transform = `translateX(${dir * (window.innerWidth + 200)}px) rotate(${dir * 24}deg)`;
            card.style.opacity = 0;
            setTimeout(() => { busy = false; mark(v); }, 260);
        }
        // Кнопки «Знаю / Не знаю» — та же анимация
        function fly(v) {
            const c = document.querySelector('.card');
            if (!c || busy) { mark(v); return; }
            paint(c, v === 'k' ? 50 : -50);
            fling(c, v);
        }

        $('v').addEventListener('touchstart', e => {
            if (busy) return;
            const c = e.target.closest('.card');
            tcard = tab === 'study' ? c : null;
            drag = false;
            if (tcard) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
        }, { passive: true });
        $('v').addEventListener('touchmove', e => {
            if (!tcard || busy) return;
            const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
            if (!drag && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { drag = true; tcard.classList.add('drag'); }
            if (drag) { pdx = dx; if (!praf) praf = requestAnimationFrame(() => { praf = 0; if (tcard && drag) paint(tcard, pdx); }); }
        }, { passive: true });
        const endTouch = e => {
            const c = tcard;
            tcard = null;
            if (!c || !drag) return;
            drag = false;
            swiped = true;
            setTimeout(() => swiped = false, 400);
            const dx = e.changedTouches[0].clientX - tx;
            if (e.type === 'touchend' && Math.abs(dx) >= TH()) fling(c, dx > 0 ? 'k' : 'u');
            else { c.classList.remove('drag'); unpaint(c); }
        };
        $('v').addEventListener('touchend', endTouch);
        $('v').addEventListener('touchcancel', endTouch);

        /* Прячем нижнее меню, пока открыта клавиатура */
        const isText = el => el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !/^(color|file)$/.test(el.type);
        document.addEventListener('focusin', e => { if (isText(e.target)) { document.body.classList.add('typing'); document.body.classList.remove('nav-peek'); } });
        document.addEventListener('focusout', () => setTimeout(() => { if (!isText(document.activeElement)) document.body.classList.remove('typing', 'nav-peek'); }, 120));

        /* Свайп вниз — нижнее меню пропадает, свайп вверх — появляется (в т.ч. при открытой клавиатуре) */
        let sy = 0, sx = 0;
        document.addEventListener('touchstart', e => { sy = e.touches[0].clientY; sx = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchmove', e => {
            const dy = e.touches[0].clientY - sy, dx = e.touches[0].clientX - sx;
            if (Math.abs(dy) < 24 || Math.abs(dy) < Math.abs(dx)) return;   // горизонтальный свайп карточки не трогаем
            const up = dy < 0, b = document.body.classList;
            if (up ? (b.contains('nav-peek') && !b.contains('nav-hide')) : (b.contains('nav-hide') && !b.contains('nav-peek'))) return;   // уже в нужном состоянии
            b.toggle('nav-hide', !up);
            b.toggle('nav-peek', up);
        }, { passive: true });

        document.addEventListener('keydown', e => {
            if (tab !== 'study' || /INPUT|SELECT/.test(e.target.tagName)) return;
            if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!flipping) doFlip(); }
            else if (e.key === 'ArrowLeft') mark('u');
            else if (e.key === 'ArrowRight') mark('k');
        });

        $('t-settings').innerHTML = ic('gear');
        build();
        render();
        perfProbe();
        cloudInit();
    </script>
</body>
</html>
